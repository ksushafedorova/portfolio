<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Theatre Works — Ksenia Fedorova</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  background: #000;
  font-family: Arial, sans-serif;
}

canvas {
  position: fixed;
  inset: 0;
  z-index: 0;
}

.overlay {
  position: fixed;
  inset: 0;
  background: radial-gradient(
    ellipse at center,
    rgba(0,0,0,0.20),
    rgba(0,0,0,0.75)
  );
  z-index: 1;
  pointer-events: none;
}

/* PANEL */
.panel {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(0.95);

  width: 520px;
  background: rgba(0,0,0,0.85);
  border: 1px solid rgba(255,255,255,0.15);

  padding: 14px;
  z-index: 10;

  opacity: 0;
  pointer-events: none;
  transition: 0.5s ease;
}

.panel.open {
  opacity: 1;
  pointer-events: auto;
  transform: translate(-50%, -50%) scale(1);
}

.panel img {
  width: 100%;
  margin-bottom: 10px;
}

/* hint */
.hint {
  position: fixed;
  top: 20px;
  left: 20px;
  color: rgba(255,255,255,0.7);
  z-index: 2;
  font-size: 13px;
}
</style>
</head>

<body>

<div class="overlay"></div>
<div class="hint">hover + click clouds</div>

<div class="panel" id="panel">
  <img src="theatre1.jpg">
  <div>Children’s theatre production (Kazan)</div>
  <audio id="audio" src="theatre1.mp3"></audio>
  <button id="btn">PLAY</button>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.161/build/three.module.js';

const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-1,1,1,-1,0.1,10);
camera.position.z = 1;

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

/* ===== BACKGROUND (ТВОЙ СТАРЫЙ ШЕЙДЕР) ===== */
const texture = new THREE.TextureLoader().load('clouds_theatre.jpg');
texture.colorSpace = THREE.SRGBColorSpace;

const mouse = new THREE.Vector2(0.5,0.5);
const prevMouse = new THREE.Vector2(0.5,0.5);

window.addEventListener('mousemove',(e)=>{
  mouse.x = e.clientX / innerWidth;
  mouse.y = 1 - e.clientY / innerHeight;
});

const material = new THREE.ShaderMaterial({
  uniforms:{
    uTexture:{value:texture},
    uMouse:{value:mouse},
    uPrevMouse:{value:prevMouse},
    uTime:{value:0}
  },
  vertexShader:`
    varying vec2 vUv;
    void main(){
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);
    }
  `,
  fragmentShader:`
    uniform sampler2D uTexture;
    uniform vec2 uMouse;
    uniform vec2 uPrevMouse;
    uniform float uTime;
    varying vec2 vUv;

    void main(){

      vec2 uv = vUv;

      float d = distance(uv,uMouse);
      float dp = distance(uv,uPrevMouse);

      float ripple =
        sin(d*55.0 - uTime*10.0)*exp(-d*12.0) +
        sin(dp*60.0 - uTime*8.0)*exp(-dp*10.0);

      uv += vec2(
        sin(uTime*0.2 + uv.y*10.0),
        cos(uTime*0.18 + uv.x*10.0)
      ) * 0.002;

      uv += ripple * 0.004;

      vec4 c = texture2D(uTexture, uv);

      vec3 col = c.rgb * 0.9;
      col = col / (col + vec3(0.55));

      gl_FragColor = vec4(col,1.0);
    }
  `
});

scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), material));

/* ===== CLOUD NODES (кликабельные, но НЕ ломают фон) ===== */
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();

const nodes = [];

function addNode(x,y){
  const geo = new THREE.CircleGeometry(0.035, 24);
  const mat = new THREE.MeshBasicMaterial({
    color: 0xffffff,
    transparent:true,
    opacity:0.8
  });

  const m = new THREE.Mesh(geo,mat);
  m.position.set(x,y,0);
  scene.add(m);
  nodes.push(m);
}

addNode(-0.35,0.25);
addNode(0.25,-0.1);
addNode(0.4,0.3);

/* CLICK */
window.addEventListener('click',(e)=>{
  pointer.x = (e.clientX / innerWidth) * 2 - 1;
  pointer.y = -(e.clientY / innerHeight) * 2 + 1;

  raycaster.setFromCamera(pointer,camera);

  const hits = raycaster.intersectObjects(nodes);

  if(hits.length){
    openPanel();
  }
});

/* PANEL */
const panel = document.getElementById('panel');
const audio = document.getElementById('audio');
const btn = document.getElementById('btn');

function openPanel(){
  panel.classList.add('open');
}

btn.onclick = ()=>{
  if(audio.paused){
    audio.play();
    btn.textContent = "PAUSE";
  } else {
    audio.pause();
    btn.textContent = "PLAY";
  }
};

/* LOOP */
function animate(t){
  material.uniforms.uTime.value = t * 0.001;
  prevMouse.lerp(mouse,0.08);   // ← ВОТ ЭТО ВАЖНО (твоя “вода” возвращена)
  renderer.render(scene,camera);
  requestAnimationFrame(animate);
}
animate();

window.addEventListener('resize',()=>{
  renderer.setSize(innerWidth,innerHeight);
});
</script>

</body>
</html>
