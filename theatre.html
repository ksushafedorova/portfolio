<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Theatre Works — Ksenia Fedorova</title>

<style>
.cloudNode {
  position: fixed;
  width: 26px;
  height: 26px;
  border-radius: 50%;

  background: radial-gradient(
    circle at 30% 30%,
    rgba(255,255,255,0.65),
    rgba(255,255,255,0.15),
    rgba(255,255,255,0)
  );

  filter: blur(2px);
  opacity: 0.85;

  z-index: 5;
  cursor: pointer;

  transition: transform 0.4s ease, opacity 0.4s ease;
}

.cloudNode:hover {
  transform: scale(1.8);
  opacity: 1;
}

.cloudNode.hide {
  opacity: 0;
  transform: scale(0.2);
  pointer-events: none;
}

html, body {
  margin: 0;
  padding: 0;
  overflow: auto;
  font-family: Arial, sans-serif;
  color: #f2f2f2;
  background: #000;
}

canvas {
  position: fixed;
  top: 0;
  left: 0;
  z-index: 0;
  pointer-events: none;
}

.overlay {
  position: fixed;
  inset: 0;
  background: radial-gradient(
    ellipse at center,
    rgba(0,0,0,0.25),
    rgba(0,0,0,0.78)
  );
  z-index: 1;
  pointer-events: none;
}

main {
  position: relative;
  z-index: 2;
  width: 100%;
  text-align: center;
  padding: 120px 40px;
  box-sizing: border-box;
}

h1 {
  font-size: 38px;
  font-weight: normal;
  margin-bottom: 12px;
}

.subtitle {
  font-size: 16px;
  color: #cfcfcf;
  margin-bottom: 30px;
}

.description {
  max-width: 650px;
  margin: 0 auto 50px auto;
  line-height: 1.7;
  font-size: 15px;
  color: #bdbdbd;
}

h2 {
  font-size: 18px;
  font-weight: normal;
  margin-bottom: 10px;
  color: #e6e6e6;
}

p {
  font-size: 14px;
  line-height: 1.6;
  color: #cfcfcf;
  max-width: 700px;
  margin: 0 auto;
}

img {
  width: 100%;
  max-width: 720px;
  margin: 25px auto;
  display: block;
  opacity: 0;
  transform: scale(0.86) translateY(18px);
  filter: contrast(0.9) saturate(0.85) blur(1px);
  transition: transform 1.4s ease, opacity 1.4s ease, filter 1.4s ease;
}

img.visible {
  opacity: 1;
  transform: scale(1) translateY(0);
  filter: contrast(1) saturate(0.95) blur(0px);
}

.playBtn {
  padding: 10px 14px;
  border: 1px solid rgba(255,255,255,0.4);
  background: transparent;
  color: #f2f2f2;
  cursor: pointer;
}

.project {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 18px;
  max-width: 500px;
  margin: 0 auto;
  transform: translateX(-30px);
}

#theatreImg {
  width: 280px;
  max-width: 40%;
}

.right {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.track {
  background: transparent;
  border: 1px solid rgba(255,255,255,0.3);
  color: white;
  font-size: 12px;
  padding: 4px 6px;
}

audio {
  width: 100%;
  max-width: 720px;
}
</style>
</head>

<body>

<div class="overlay"></div>
<div class="cloudNode" id="theatreNode"></div>

<main>

<h1>Theatre Works</h1>

<div class="subtitle">
  Selected compositions for theatre productions
</div>

<div class="description">
  Original music for theatre projects, productions and studies.
</div>

<div class="spacer"></div>

<h2>Children’s theatre production (Kazan)</h2>

<p>
  Original music for a long-running repertory production in a state theatre.
</p>

<div class="project">

  <img src="theatre1.jpg" id="theatreImg">

  <div class="right">
    <div class="trackTitle">excerpt 01</div>
    <button id="playBtn" class="playBtn">PLAY</button>

    <div class="trackList">
      <button class="track" data-src="excerpt1.mp3">01</button>
      <button class="track" data-src="excerpt2.mp3">02</button>
      <button class="track" data-src="excerpt3.mp3">03</button>
    </div>
  </div>

  <audio id="theatreAudio" preload="none">
    <source src="excerpt1.mp3" type="audio/mpeg">
  </audio>

</div>

</main>

<script type="module">
// THREE + interaction code (как у тебя было до изменений)
</script>

</body>
</html>
