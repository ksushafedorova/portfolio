<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Theatre Works — Ksenia Fedorova</title>

<style>
  .cloudNode {
  position: fixed;
  width: 26px;
  height: 26px;
  border-radius: 50%;

  background: radial-gradient(
    circle at 30% 30%,
    rgba(255,255,255,0.65),
    rgba(255,255,255,0.15),
    rgba(255,255,255,0)
  );

  filter: blur(2px);
  opacity: 0.85;

  z-index: 5;
  cursor: pointer;

  transition: transform 0.4s ease, opacity 0.4s ease;
}

.cloudNode:hover {
  transform: scale(1.8);
  opacity: 1;
} 
  .cloudNode.hide {
  opacity: 0;
  transform: scale(0.2);
  pointer-events: none;
}
html, body {
  margin: 0;
  padding: 0;
  overflow: auto;
  font-family: Arial, sans-serif;
  color: #f2f2f2;
  background: #000;
}

/* background canvas */
canvas {
  position: fixed;
  top: 0;
  left: 0;
  z-index: 0;
}

/* deep atmosphere */
.overlay {
  position: fixed;
  inset: 0;
  background: radial-gradient(
    ellipse at center,
    rgba(0,0,0,0.25),
    rgba(0,0,0,0.78)
  );
  z-index: 1;
  pointer-events: none;
}

/* layout */
main {
  position: relative;
  z-index: 2;
  width: 100%;
  text-align: center;
  padding: 120px 40px;
  box-sizing: border-box;
}

/* typography */
h1 {
  font-size: 38px;
  font-weight: normal;
  margin-bottom: 12px;
}

.subtitle {
  font-size: 16px;
  color: #cfcfcf;
  margin-bottom: 30px;
}

.description {
  max-width: 650px;
  margin: 0 auto 50px auto;
  line-height: 1.7;
  font-size: 15px;
  color: #bdbdbd;
}

/* project */
h2 {
  font-size: 18px;
  font-weight: normal;
  margin-bottom: 10px;
  color: #e6e6e6;
}

p {
  font-size: 14px;
  line-height: 1.6;
  color: #cfcfcf;
  max-width: 700px;
  margin: 0 auto;
}

/* 🌊 IMAGE: emerging object */
img {
  width: 100%;
  max-width: 720px;
  margin: 25px auto;
  display: block;

  opacity: 0;
  transform: scale(0.86) translateY(18px);
  filter: contrast(0.9) saturate(0.85) blur(1px);

  transition:
    transform 1.4s ease,
    opacity 1.4s ease,
    filter 1.4s ease;
}

/* when loaded → “emerges” */
img.visible {
  opacity: 1;
  transform: scale(1) translateY(0);
  filter: contrast(1) saturate(0.95) blur(0px);
}

/* audio minimal */
audio {
  width: 100%;
  max-width: 720px;
  margin-top: 10px;
  opacity: 0.75;
}

/* spacing */
.spacer {
  height: 60px;
}
.playBtn {
  padding: 10px 14px;
  border: 1px solid rgba(255,255,255,0.4);
  background: transparent;
  color: #f2f2f2;
  cursor: pointer;
  letter-spacing: 2px;

  opacity: 0;
  pointer-events: none;
  transform: translateY(10px);
  transition: 0.8s ease;
}

.playBtn.show {
  opacity: 1;
  pointer-events: auto;
  transform: translateY(0);
}
  .project {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
}

#theatreImg {
  width: 280px;
  max-width: 40%;
}

.right {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  justify-content: center;
}
  .trackTitle {
  font-size: 12px;
  opacity: 0.7;
  letter-spacing: 1px;
}

.trackList {
  display: flex;
  gap: 6px;
  margin-top: 6px;
}

.track {
  background: transparent;
  border: 1px solid rgba(255,255,255,0.3);
  color: white;
  font-size: 12px;
  padding: 4px 6px;
  cursor: pointer;
  opacity: 0.7;
  transition: 0.3s ease;
}

.track:hover {
  opacity: 1;
  border-color: white;
}.right,
.trackTitle,
.trackList,
.playBtn {
  opacity: 0;
  pointer-events: none;
  transform: translateY(10px);
  transition: 0.8s ease;
}

.right.show,
.trackTitle.show,
.trackList.show,
.playBtn.show {
  opacity: 1;
  pointer-events: auto;
  transform: translateY(0);
}
</style>
</head>

<body>

<div class="overlay"></div>
  <div class="cloudNode" id="theatreNode"></div>

<main>

  <h1>Theatre Works</h1>

  <div class="subtitle">
    Selected compositions for theatre productions
  </div>

  <div class="description">
    Original music for theatre projects, productions and studies.
  </div>

  <div class="spacer"></div>

  <h2>Children’s theatre production (Kazan)</h2>

  <p>
    Original music for a long-running repertory production in a state theatre.
  </p>
<div class="project">

  <img src="theatre1.jpg" id="theatreImg">

  <div class="right">

  <div class="trackTitle">excerpt 01</div>

  <button id="playBtn" class="playBtn">PLAY</button>

  <div class="trackList">
    <button class="track" data-src="excerpt1.mp3">01</button>
    <button class="track" data-src="excerpt2.mp3">02</button>
    <button class="track" data-src="excerpt3.mp3">03</button>
  </div>

</div>

<audio id="theatreAudio" preload="none">
  <source src="excerpt1.mp3" type="audio/mpeg">
</audio>
</main>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.161/build/three.module.js';

const scene = new THREE.Scene();

const camera = new THREE.OrthographicCamera(-1,1,1,-1,0.1,10);
camera.position.z = 1;

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

/* background texture */
const texture = new THREE.TextureLoader().load('clouds_theatre.jpg');
texture.colorSpace = THREE.SRGBColorSpace;

/* mouse */
const mouse = new THREE.Vector2(0.5, 0.5);
const prevMouse = new THREE.Vector2(0.5, 0.5);
  let isOpened = false;

window.addEventListener('mousemove', (e) => {
  mouse.x = e.clientX / window.innerWidth;
  mouse.y = 1.0 - e.clientY / window.innerHeight;
});

const geometry = new THREE.PlaneGeometry(2,2);

const material = new THREE.ShaderMaterial({

  uniforms: {
    uTexture: { value: texture },
    uMouse: { value: mouse },
    uPrevMouse: { value: prevMouse },
    uTime: { value: 0 }
  },

  vertexShader: `
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);
    }
  `,

  fragmentShader: `
    uniform sampler2D uTexture;
    uniform vec2 uMouse;
    uniform vec2 uPrevMouse;
    uniform float uTime;

    varying vec2 vUv;

    void main() {

      vec2 uv = vUv;

      float d = distance(uv, uMouse);
      float dp = distance(uv, uPrevMouse);

      float wave = sin(d * 55.0 - uTime * 10.0);
      float wave2 = sin(dp * 60.0 - uTime * 8.0);

      float falloff = exp(-d * 12.0);
      float falloff2 = exp(-dp * 10.0);

      float ripple = wave * falloff + wave2 * falloff2;

      float n1 = sin(uTime * 0.2 + uv.y * 10.0);
      float n2 = cos(uTime * 0.18 + uv.x * 10.0);

      uv += vec2(n1,n2)*0.002;
      uv += ripple*0.004;

      vec4 color = texture2D(uTexture, uv);

      vec3 c = color.rgb;
      c *= 0.85;
      c = c / (c + vec3(0.55));

      gl_FragColor = vec4(c,1.0);
    }
  `
});

scene.add(new THREE.Mesh(geometry, material));

function animate(t){
  material.uniforms.uTime.value = t*0.001;
  prevMouse.lerp(mouse,0.08);
  renderer.render(scene,camera);
  requestAnimationFrame(animate);
}
animate();

/* ✨ emergence trigger */

const node = document.getElementById('theatreNode');

function placeNode() {
  node.style.left = (window.innerWidth * 0.62) + 'px';
  node.style.top = (window.innerHeight * 0.45) + 'px';
}

placeNode();

window.addEventListener('resize', placeNode);

const node = document.getElementById('theatreNode');

const img = document.getElementById('theatreImg');
const audio = document.getElementById('theatreAudio');
const playBtn = document.getElementById('playBtn');

let isOpened = false;
let isPlaying = false;

/* открыть сцену по облаку */
node.addEventListener('click', () => {

  if (isOpened) return;
  isOpened = true;

  node.classList.add('hide');

  // показать UI
  img?.classList.add('visible');
  document.querySelector('.right')?.classList.add('show');
  document.querySelector('.trackList')?.classList.add('show');
  document.querySelector('.trackTitle')?.classList.add('show');
  playBtn?.classList.add('show');

  // старт аудио
  audio.currentTime = 0;
  audio.play();

  isPlaying = true;
  playBtn.textContent = "PAUSE";
});

/* play/pause */
playBtn.addEventListener('click', (e) => {
  e.stopPropagation();

  if (!audio) return;

  if (audio.paused) {
    audio.play();
    playBtn.textContent = "PAUSE";
    isPlaying = true;
  } else {
    audio.pause();
    playBtn.textContent = "PLAY";
    isPlaying = false;
  }
});

/* переключение треков */
document.querySelectorAll('.track').forEach(track => {
  track.addEventListener('click', () => {
    const src = track.dataset.src;

    audio.src = src;
    audio.currentTime = 0;
    audio.play();

    playBtn.textContent = "PAUSE";
    isPlaying = true;
  });
});

/* resize */
window.addEventListener('resize', () => {
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
