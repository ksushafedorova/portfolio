<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Theatre Works — Ksenia Fedorova</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  overflow: auto;
  font-family: Arial, sans-serif;
  color: #f2f2f2;
  background: #000;
}

canvas {
  position: fixed;
  top: 0;
  left: 0;
  z-index: 0;
}

/* UI */
main {
  position: relative;
  z-index: 2;
  padding: 120px 60px;
  max-width: 900px;
  margin: 0 auto;
}

h1 {
  font-size: 38px;
  font-weight: normal;
  margin-bottom: 12px;
  text-align: center;
}

.subtitle {
  text-align: center;
  font-size: 16px;
  color: #cfcfcf;
  margin-bottom: 40px;
}

/* PROJECT */
.project {
  display: flex;
  gap: 40px;
  align-items: center;
}

.project img {
  width: 320px;
  opacity: 0;
  transform: translateY(25px) scale(0.92);
  transition: all 1.2s ease;
}

.project img.visible {
  opacity: 1;
  transform: translateY(0) scale(1);
}

.right {
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.playBtn {
  width: 120px;
  padding: 10px 14px;
  border: 1px solid rgba(255,255,255,0.4);
  background: transparent;
  color: #fff;
  cursor: pointer;
}

.text {
  font-size: 14px;
  line-height: 1.6;
  color: #cfcfcf;
  max-width: 420px;
}

/* ===== CLOUD NAVIGATION LAYER ===== */
.cloud {
  position: fixed;
  z-index: 3;
  cursor: pointer;
  pointer-events: auto;
  background: transparent;
}

/* позиции = “примерно где облака на фоне” */
#cloud1 { top: 25%; left: 20%; width: 200px; height: 120px; }
#cloud2 { top: 40%; left: 55%; width: 240px; height: 140px; }
#cloud3 { top: 60%; left: 30%; width: 220px; height: 130px; }

/* debug (включи если надо видеть зоны)
.cloud { border: 1px solid rgba(255,255,255,0.2); }
*/
</style>
</head>

<body>

<!-- CLOUD CLICK ZONES -->
<div class="cloud" id="cloud1"></div>
<div class="cloud" id="cloud2"></div>
<div class="cloud" id="cloud3"></div>

<main>
  <h1>Theatre Works</h1>
  <div class="subtitle">Selected compositions for theatre productions</div>

  <div class="project">
    <img src="theatre1.jpg" id="img">

    <div class="right">
      <div class="text">
        Children’s theatre production (Kazan). Original music for repertory theatre.
      </div>

      <button class="playBtn" id="playBtn">PLAY</button>
    </div>
  </div>
</main>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.161/build/three.module.js';

const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-1,1,1,-1,0.1,10);
camera.position.z = 1;

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

/* BACKGROUND */
const texture = new THREE.TextureLoader().load('clouds_theatre.jpg');

const mouse = new THREE.Vector2(0.5,0.5);
const prevMouse = new THREE.Vector2(0.5,0.5);

window.addEventListener('mousemove', e=>{
  mouse.x = e.clientX/window.innerWidth;
  mouse.y = 1 - e.clientY/window.innerHeight;
});

const material = new THREE.ShaderMaterial({
  uniforms:{
    uTexture:{value:texture},
    uMouse:{value:mouse},
    uPrevMouse:{value:prevMouse},
    uTime:{value:0}
  },

  vertexShader:`
    varying vec2 vUv;
    void main(){
      vUv=uv;
      gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);
    }
  `,

  fragmentShader:`
    uniform sampler2D uTexture;
    uniform vec2 uMouse;
    uniform vec2 uPrevMouse;
    uniform float uTime;

    varying vec2 vUv;

    void main(){
      vec2 uv=vUv;

      float d=distance(uv,uMouse);
      float dp=distance(uv,uPrevMouse);

      float ripple=
        sin(d*55.0-uTime*10.0)*exp(-d*12.0)+
        sin(dp*60.0-uTime*8.0)*exp(-dp*10.0);

      uv+=vec2(
        sin(uTime*0.2+uv.y*10.0),
        cos(uTime*0.18+uv.x*10.0)
      )*0.002;

      uv+=ripple*0.004;

      vec4 c=texture2D(uTexture,uv);

      vec3 col=c.rgb*0.9;
      col=col/(col+vec3(0.55));

      gl_FragColor=vec4(col,1.0);
    }
  `
});

scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2),material));

function animate(t){
  material.uniforms.uTime.value=t*0.001;
  prevMouse.lerp(mouse,0.06);
  renderer.render(scene,camera);
  requestAnimationFrame(animate);
}
animate();

/* IMAGE */
window.addEventListener('load',()=>{
  setTimeout(()=>{
    document.getElementById('img')?.classList.add('visible');
  },400);
});

/* AUDIO */
const audio = new Audio('theatre1.mp3');
let playing = false;

playBtn.onclick = ()=>{
  if(!playing){
    audio.play();
    playing = true;
    playBtn.textContent = "PAUSE";
  } else {
    audio.pause();
    playing = false;
    playBtn.textContent = "PLAY";
  }
};

/* CLOUD NAVIGATION */
function goToProject(id){
  alert("open: " + id); 
  // потом заменим на смену контента
}

document.getElementById('cloud1').onclick = ()=> goToProject('project1');
document.getElementById('cloud2').onclick = ()=> goToProject('project2');
document.getElementById('cloud3').onclick = ()=> goToProject('project3');

window.addEventListener('resize',()=>{
  renderer.setSize(innerWidth,innerHeight);
});
</script>

</body>
</html>
