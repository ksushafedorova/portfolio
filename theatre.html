<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Theatre Works — Ksenia Fedorova</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  overflow: auto;
  font-family: Arial, sans-serif;
  color: #f2f2f2;
  background: #000;
}

/* background canvas */
canvas {
  position: fixed;
  top: 0;
  left: 0;
  z-index: 0;
}

/* layout */
main {
  position: relative;
  z-index: 2;
  width: 100%;
  text-align: center;
  padding: 120px 40px;
  box-sizing: border-box;
}

/* typography */
h1 {
  font-size: 38px;
  font-weight: normal;
  margin-bottom: 12px;
}

.subtitle {
  font-size: 16px;
  color: #cfcfcf;
  margin-bottom: 30px;
}

.description {
  max-width: 650px;
  margin: 0 auto 50px auto;
  line-height: 1.7;
  font-size: 15px;
  color: #bdbdbd;
}

/* hidden hotspot layer (cloud navigation) */
.hotspot {
  position: fixed;
  width: 80px;
  height: 80px;
  z-index: 3;
  cursor: pointer;
  border-radius: 50%;
  background: rgba(255,255,255,0.0);
}

/* PANEL */
.panel {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -45%) scale(0.92);

  width: 520px;
  background: rgba(0,0,0,0.72);
  border: 1px solid rgba(255,255,255,0.12);

  padding: 18px;
  z-index: 10;

  opacity: 0;
  pointer-events: none;

  transition: 0.8s ease;
  backdrop-filter: blur(10px);
}

.panel.open {
  opacity: 1;
  transform: translate(-50%, -50%) scale(1);
  pointer-events: auto;
}

.panel img {
  width: 100%;
  margin-bottom: 12px;
}

.panel .title {
  font-size: 16px;
  margin-bottom: 8px;
}

.panel button {
  margin-top: 10px;
  padding: 8px 12px;
  border: 1px solid #fff;
  background: transparent;
  color: #fff;
  cursor: pointer;
}
</style>
</head>

<body>

<main>
  <h1>Theatre Works</h1>
  <div class="subtitle">Selected compositions for theatre productions</div>
  <div class="description">Click on cloud points in the background.</div>
</main>

<!-- CLOUD NAVIGATION HIT AREA -->
<div class="hotspot" data-id="theatre"></div>

<!-- FLOATING PANEL -->
<div class="panel" id="panel">
  <img src="theatre1.jpg">
  <div class="title">Children’s theatre production (Kazan)</div>

  <audio id="audio" src="theatre1.mp3"></audio>

  <button id="playBtn">PLAY</button>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.161/build/three.module.js';

const scene = new THREE.Scene();

const camera = new THREE.OrthographicCamera(-1,1,1,-1,0.1,10);
camera.position.z = 1;

const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
document.body.appendChild(renderer.domElement);

/* CLOUD TEXTURE */
const texture = new THREE.TextureLoader().load('clouds_theatre.jpg');

/* mouse */
const mouse = new THREE.Vector2(0.5,0.5);
const prevMouse = new THREE.Vector2(0.5,0.5);

window.addEventListener('mousemove', e=>{
  mouse.x = e.clientX/window.innerWidth;
  mouse.y = 1 - e.clientY/window.innerHeight;
});

const material = new THREE.ShaderMaterial({
  uniforms:{
    uTexture:{value:texture},
    uMouse:{value:mouse},
    uPrevMouse:{value:prevMouse},
    uTime:{value:0}
  },

  vertexShader: `
    varying vec2 vUv;
    void main(){
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);
    }
  `,

  fragmentShader: `
    uniform sampler2D uTexture;
    uniform vec2 uMouse;
    uniform vec2 uPrevMouse;
    uniform float uTime;

    varying vec2 vUv;

    void main(){
      vec2 uv = vUv;

      float d = distance(uv,uMouse);
      float dp = distance(uv,uPrevMouse);

      float ripple =
        sin(d*55.0-uTime*10.0)*exp(-d*12.0) +
        sin(dp*60.0-uTime*8.0)*exp(-dp*10.0);

      uv += vec2(
        sin(uTime*0.2+uv.y*10.0),
        cos(uTime*0.18+uv.x*10.0)
      )*0.002;

      uv += ripple*0.004;

      vec4 c = texture2D(uTexture,uv);

      vec3 col = c.rgb * 0.85;
      col = col / (col + vec3(0.55));

      gl_FragColor = vec4(col,1.0);
    }
  `
});

scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2),material));

function animate(t){
  material.uniforms.uTime.value = t*0.001;
  prevMouse.lerp(mouse,0.06);
  renderer.render(scene,camera);
  requestAnimationFrame(animate);
}
animate();

/* PANEL LOGIC */
const panel = document.getElementById('panel');
const audio = document.getElementById('audio');
const btn = document.getElementById('playBtn');

document.querySelector('.hotspot').addEventListener('click', ()=>{
  panel.classList.add('open');
});

btn.onclick = () => {
  if(audio.paused){
    audio.play();
    btn.textContent = "PAUSE";
  } else {
    audio.pause();
    btn.textContent = "PLAY";
  }
};

window.addEventListener('resize',()=>{
  renderer.setSize(innerWidth,innerHeight);
});
</script>

</body>
</html>
