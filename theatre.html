<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Theatre Works — Ksenia Fedorova</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  overflow: auto;
  font-family: Arial, sans-serif;
  color: #f2f2f2;
  background: #000;
}

/* canvas background */
canvas {
  position: fixed;
  top: 0;
  left: 0;
  z-index: 0;
}

/* dark overlay like index */
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.25);
  z-index: 1;
  pointer-events: none;
}

/* TEXT (no white blocks) */
main {
  position: relative;
  z-index: 2;
  width: 100%;
  text-align: center;
  padding: 120px 40px;
  box-sizing: border-box;
}

h1 {
  font-size: 38px;
  font-weight: normal;
  margin-bottom: 12px;
}

.subtitle {
  font-size: 16px;
  color: #d9d9d9;
  margin-bottom: 34px;
}

.description {
  max-width: 650px;
  margin: 0 auto 60px auto;
  line-height: 1.7;
  font-size: 15px;
  color: #cfcfcf;
}

hr {
  border: none;
  border-top: 1px solid rgba(255,255,255,0.15);
  margin: 40px auto;
  width: 60%;
}

h2 {
  font-size: 18px;
  font-weight: normal;
  margin-bottom: 10px;
}

p {
  font-size: 15px;
  line-height: 1.6;
  color: #e6e6e6;
}

img {
  width: 100%;
  max-width: 800px;
  margin: 20px auto;
  display: block;
}

audio {
  width: 100%;
  max-width: 800px;
  margin-top: 10px;
}
</style>
</head>

<body>

<div class="overlay"></div>

<main>

  <h1>Theatre Works</h1>

  <div class="subtitle">
    Selected compositions for theatre productions
  </div>

  <div class="description">
    Original music for theatre projects, productions and studies.
  </div>

  <hr>

  <h2>Children’s theatre production (Kazan)</h2>

  <p>
    Original music for a long-running repertory production in a state theatre.
  </p>

  <img src="theatre1.jpg">

  <audio controls>
    <source src="theatre1.mp3" type="audio/mpeg">
  </audio>

</main>

<script type="module">

import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.161/build/three.module.js';

const scene = new THREE.Scene();

const camera = new THREE.OrthographicCamera(-1,1,1,-1,0.1,10);
camera.position.z = 1;

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

/* SAME BACKGROUND SYSTEM AS INDEX */
const texture = new THREE.TextureLoader().load('clouds_theatre.jpg');
texture.colorSpace = THREE.SRGBColorSpace;

const mouse = new THREE.Vector2(0.5, 0.5);
const prevMouse = new THREE.Vector2(0.5, 0.5);

window.addEventListener('mousemove', (e) => {
  mouse.x = e.clientX / window.innerWidth;
  mouse.y = 1.0 - e.clientY / window.innerHeight;
});

const geometry = new THREE.PlaneGeometry(2,2);

const material = new THREE.ShaderMaterial({

  uniforms: {
    uTexture: { value: texture },
    uMouse: { value: mouse },
    uPrevMouse: { value: prevMouse },
    uTime: { value: 0 }
  },

  vertexShader: `
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);
    }
  `,

  fragmentShader: `
    uniform sampler2D uTexture;
    uniform vec2 uMouse;
    uniform vec2 uPrevMouse;
    uniform float uTime;

    varying vec2 vUv;

    void main() {

      vec2 uv = vUv;

      float d = distance(uv, uMouse);
      float dp = distance(uv, uPrevMouse);

      float wave = sin(d * 55.0 - uTime * 10.0);
      float wave2 = sin(dp * 60.0 - uTime * 8.0);

      float falloff = exp(-d * 12.0);
      float falloff2 = exp(-dp * 10.0);

      float ripple = wave * falloff + wave2 * falloff2;

      float n1 = sin(uTime * 0.2 + uv.y * 10.0);
      float n2 = cos(uTime * 0.18 + uv.x * 10.0);

      uv += vec2(n1,n2)*0.002;
      uv += ripple*0.004;

      vec4 color = texture2D(uTexture, uv);

      float exposure = 1.10;
      vec3 c = color.rgb * exposure;
      c = c / (c + vec3(0.42));

      gl_FragColor = vec4(c,1.0);
    }
  `
});

scene.add(new THREE.Mesh(geometry, material));

function animate(t){
  material.uniforms.uTime.value = t*0.001;
  prevMouse.lerp(mouse,0.08);
  renderer.render(scene,camera);
  requestAnimationFrame(animate);
}
animate();

window.addEventListener('resize', () => {
  renderer.setSize(window.innerWidth, window.innerHeight);
});

</script>

</body>
</html>
