<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Theatre Works — Ksenia Fedorova</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  overflow: auto;
  font-family: Arial, sans-serif;
  color: #f2f2f2;
  background: #000;
}

/* canvas background */
canvas {
  position: fixed;
  top: 0;
  left: 0;
  z-index: 0;
}

/* overlay */
.overlay {
  position: fixed;
  inset: 0;
  background: radial-gradient(
    ellipse at center,
    rgba(0,0,0,0.25),
    rgba(0,0,0,0.78)
  );
  z-index: 1;
  pointer-events: none;
}

/* cloud node */
.cloudNode {
  position: fixed;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: radial-gradient(
    circle at 30% 30%,
    rgba(255,255,255,0.65),
    rgba(255,255,255,0.15),
    rgba(255,255,255,0)
  );
  filter: blur(2px);
  opacity: 0.85;
  z-index: 5;
  cursor: pointer;
  transition: transform 0.4s ease, opacity 0.4s ease;
}

.cloudNode:hover {
  transform: scale(1.8);
}

.cloudNode.hide {
  opacity: 0;
  pointer-events: none;
}

/* layout */
main {
  position: relative;
  z-index: 2;
  width: 100%;
  text-align: center;
  padding: 120px 40px;
  box-sizing: border-box;
}

h1 { font-size: 38px; font-weight: normal; }
.subtitle { font-size: 16px; color: #cfcfcf; margin-bottom: 30px; }
.description { max-width: 650px; margin: 0 auto 50px; color: #bdbdbd; }

/* project layout */
.project {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
}

#theatreImg {
  width: 280px;
  max-width: 40%;
  opacity: 0;
  transform: scale(0.9);
  transition: 1.2s ease;
}

#theatreImg.visible {
  opacity: 1;
  transform: scale(1);
}

/* right panel */
.right {
  display: flex;
  flex-direction: column;
  gap: 8px;
  opacity: 0;
  transform: translateY(10px);
  pointer-events: none;
  transition: 0.8s ease;
}

.right.show {
  opacity: 1;
  transform: translateY(0);
  pointer-events: auto;
}

.trackTitle {
  font-size: 12px;
  opacity: 0.7;
}

.trackList {
  display: flex;
  gap: 6px;
}

.track {
  background: transparent;
  border: 1px solid rgba(255,255,255,0.3);
  color: white;
  font-size: 12px;
  padding: 4px 6px;
  cursor: pointer;
}

/* play button */
.playBtn {
  padding: 8px 12px;
  border: 1px solid rgba(255,255,255,0.4);
  background: transparent;
  color: white;
  cursor: pointer;
  opacity: 0;
  pointer-events: none;
  transition: 0.8s ease;
}

.playBtn.show {
  opacity: 1;
  pointer-events: auto;
}

/* audio hidden */
audio {
  display: none;
}
</style>
</head>

<body>

<div class="overlay"></div>

<div class="cloudNode" id="theatreNode"></div>

<main>

  <h1>Theatre Works</h1>
  <div class="subtitle">Selected compositions for theatre productions</div>
  <div class="description">Original music for theatre projects.</div>

  <div class="project">

    <img src="theatre1.jpg" id="theatreImg">

    <div class="right">

      <div class="trackTitle">excerpt 01</div>

      <button id="playBtn" class="playBtn">PLAY</button>

      <div class="trackList">
        <button class="track" data-src="excerpt1.mp3">01</button>
        <button class="track" data-src="excerpt2.mp3">02</button>
        <button class="track" data-src="excerpt3.mp3">03</button>
      </div>

    </div>

  </div>

  <audio id="theatreAudio" src="excerpt1.mp3"></audio>

</main>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.161/build/three.module.js';

/* ===== THREE BACKGROUND ===== */
const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-1,1,1,-1,0.1,10);
camera.position.z = 1;

const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const texture = new THREE.TextureLoader().load('clouds_theatre.jpg');

const material = new THREE.ShaderMaterial({
  uniforms: {
    uTexture: { value: texture },
    uTime: { value: 0 }
  },
  vertexShader: `
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);
    }
  `,
  fragmentShader: `
    uniform sampler2D uTexture;
    uniform float uTime;
    varying vec2 vUv;

    void main() {
      vec2 uv = vUv;
      uv += sin(uTime + uv.yx * 2.0) * 0.002;
      vec4 c = texture2D(uTexture, uv);
      gl_FragColor = c;
    }
  `
});

scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), material));

function animate(t){
  material.uniforms.uTime.value = t * 0.001;
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}
animate();

/* ===== UI LOGIC ===== */
const node = document.getElementById('theatreNode');
const img = document.getElementById('theatreImg');
const right = document.querySelector('.right');
const playBtn = document.getElementById('playBtn');
const audio = document.getElementById('theatreAudio');

let opened = false;

/* position node */
function placeNode(){
  node.style.left = window.innerWidth * 0.62 + 'px';
  node.style.top = window.innerHeight * 0.45 + 'px';
}
placeNode();
window.addEventListener('resize', () => {
  placeNode();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* open scene */
node.addEventListener('click', () => {
  if (opened) return;
  opened = true;

  node.classList.add('hide');
  img.classList.add('visible');
  right.classList.add('show');
  playBtn.classList.add('show');

  audio.play();
});

/* play/pause */
playBtn.addEventListener('click', (e) => {
  e.stopPropagation();

  if (audio.paused) {
    audio.play();
    playBtn.textContent = "PAUSE";
  } else {
    audio.pause();
    playBtn.textContent = "PLAY";
  }
});

/* tracks */
document.querySelectorAll('.track').forEach(t => {
  t.addEventListener('click', () => {
    audio.src = t.dataset.src;
    audio.play();
    playBtn.textContent = "PAUSE";
  });
});
</script>

</body>
</html>
