<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Theatre Works</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  background: #000;
  font-family: Arial, sans-serif;
}

canvas {
  display: block;
}

/* минимальный текст */
main {
  position: absolute;
  z-index: 2;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
  color: #f2f2f2;
  pointer-events: none;
}

h1 {
  font-size: 36px;
  font-weight: normal;
}
</style>
</head>

<body>

<main>
  <h1>Theatre Works</h1>
</main>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.161/build/three.module.js';

const scene = new THREE.Scene();

const camera = new THREE.OrthographicCamera(-1,1,1,-1,0.1,10);
camera.position.z = 1;

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
document.body.appendChild(renderer.domElement);

/* 🎭 THE ONLY BACKGROUND */
const texture = new THREE.TextureLoader().load('clouds_theatre.jpg');
texture.colorSpace = THREE.SRGBColorSpace;

/* mouse */
const mouse = new THREE.Vector2(0.5,0.5);
const prevMouse = new THREE.Vector2(0.5,0.5);

window.addEventListener('mousemove', e=>{
  mouse.x = e.clientX/innerWidth;
  mouse.y = 1 - e.clientY/innerHeight;
});

/* shader */
const material = new THREE.ShaderMaterial({

  uniforms:{
    uTexture:{value:texture},
    uMouse:{value:mouse},
    uPrevMouse:{value:prevMouse},
    uTime:{value:0}
  },

  vertexShader:`
    varying vec2 vUv;
    void main(){
      vUv=uv;
      gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);
    }
  `,

  fragmentShader:`
    uniform sampler2D uTexture;
    uniform vec2 uMouse;
    uniform vec2 uPrevMouse;
    uniform float uTime;

    varying vec2 vUv;

    void main(){
      vec2 uv=vUv;

      float d=distance(uv,uMouse);
      float dp=distance(uv,uPrevMouse);

      float ripple =
        sin(d*55.0-uTime*10.0)*exp(-d*12.0) +
        sin(dp*60.0-uTime*8.0)*exp(-dp*10.0);

      uv += vec2(
        sin(uTime*0.2+uv.y*10.0),
        cos(uTime*0.18+uv.x*10.0)
      )*0.002;

      uv += ripple*0.004;

      gl_FragColor = texture2D(uTexture, uv);
    }
  `
});

scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2),material));

function animate(t){
  material.uniforms.uTime.value=t*0.001;
  prevMouse.lerp(mouse,0.08);
  renderer.render(scene,camera);
  requestAnimationFrame(animate);
}
animate();

window.addEventListener('resize',()=>{
  renderer.setSize(innerWidth,innerHeight);
});
</script>

</body>
</html>
