<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Theatre Works — Ksenia Fedorova</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  overflow: auto;
  font-family: Arial, sans-serif;
  background: #000;
  color: #f2f2f2;
}

canvas {
  position: fixed;
  top: 0;
  left: 0;
  z-index: 0;
}

/* нормальная глубина, НЕ туман */
.overlay {
  position: fixed;
  inset: 0;
  background: radial-gradient(
    ellipse at center,
    rgba(0,0,0,0.15),
    rgba(0,0,0,0.65)
  );
  z-index: 1;
  pointer-events: none;
}

main {
  position: relative;
  z-index: 2;
  text-align: center;
  padding: 120px 40px;
}

h1 {
  font-size: 38px;
  font-weight: normal;
}

.subtitle {
  font-size: 16px;
  color: #cfcfcf;
  margin-bottom: 30px;
}

/* PANEL */
.panel {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(0.9);

  width: 520px;
  background: rgba(0,0,0,0.8);
  border: 1px solid rgba(255,255,255,0.15);

  padding: 15px;
  z-index: 10;

  opacity: 0;
  pointer-events: none;
  transition: 0.6s ease;
}

.panel.open {
  opacity: 1;
  pointer-events: auto;
  transform: translate(-50%, -50%) scale(1);
}

.panel img {
  width: 100%;
  display: block;
  margin-bottom: 10px;
}

/* subtle label inside clouds (debug optional) */
.label {
  position: fixed;
  z-index: 5;
}
</style>
</head>

<body>

<div class="overlay"></div>

<main>
  <h1>Theatre Works</h1>
  <div class="subtitle">Click inside the clouds</div>
</main>

<!-- PANEL -->
<div class="panel" id="panel">
  <img src="theatre1.jpg">
  <div>Children’s theatre production (Kazan)</div>
  <audio id="audio" src="theatre1.mp3"></audio>
  <button id="btn">PLAY</button>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.161/build/three.module.js';

const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-1,1,1,-1,0.1,10);
camera.position.z = 1;

const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
document.body.appendChild(renderer.domElement);

/* BACKGROUND */
const texture = new THREE.TextureLoader().load('clouds_theatre.jpg');
texture.colorSpace = THREE.SRGBColorSpace;

/* mouse */
const mouse = new THREE.Vector2();
const raycaster = new THREE.Raycaster();

/* shader background (как у тебя было — оставляем живым) */
const mat = new THREE.ShaderMaterial({
  uniforms:{
    uTexture:{value:texture},
    uMouse:{value:mouse},
    uTime:{value:0}
  },
  vertexShader:`
    varying vec2 vUv;
    void main(){
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);
    }
  `,
  fragmentShader:`
    uniform sampler2D uTexture;
    uniform vec2 uMouse;
    uniform float uTime;
    varying vec2 vUv;

    void main(){
      vec2 uv = vUv;

      float d = distance(uv,uMouse);
      uv += sin(uTime*0.1 + uv.y*8.0)*0.002;
      uv += sin(d*50.0 - uTime*8.0)*0.003;

      vec4 c = texture2D(uTexture,uv);
      vec3 col = c.rgb * 0.9;
      col = col / (col + vec3(0.5));

      gl_FragColor = vec4(col,1.0);
    }
  `
});

scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2),mat));

/* 🌫 CLOUD OBJECTS (НАВИГАЦИЯ ВНУТРИ СЦЕНЫ) */
const objects = [];

function createNode(x,y,id){
  const geo = new THREE.SphereGeometry(0.03,16,16);
  const mat = new THREE.MeshBasicMaterial({
    color: 0xffffff,
    transparent:true,
    opacity:0.9
  });

  const mesh = new THREE.Mesh(geo,mat);
  mesh.position.set(x,y,0);
  mesh.userData.id = id;

  scene.add(mesh);
  objects.push(mesh);
}

createNode(-0.3,0.2,"theatre");
createNode(0.2,-0.1,"theatre");
createNode(0.4,0.25,"theatre");

/* interaction */
window.addEventListener('mousemove',(e)=>{
  mouse.x = e.clientX/innerWidth;
  mouse.y = 1 - e.clientY/innerHeight;
});

window.addEventListener('click',(e)=>{
  const x = (e.clientX/innerWidth)*2-1;
  const y = -(e.clientY/innerHeight)*2+1;

  raycaster.setFromCamera({x,y},camera);
  const hit = raycaster.intersectObjects(objects);

  if(hit.length){
    openPanel();
  }
});

/* panel */
const panel = document.getElementById('panel');
const audio = document.getElementById('audio');
const btn = document.getElementById('btn');

function openPanel(){
  panel.classList.add('open');
}

btn.onclick = ()=>{
  if(audio.paused){
    audio.play();
    btn.textContent="PAUSE";
  } else {
    audio.pause();
    btn.textContent="PLAY";
  }
};

/* loop */
function animate(t){
  mat.uniforms.uTime.value = t*0.001;

  objects.forEach((o,i)=>{
    o.position.y += Math.sin(t*0.001 + i)*0.0005;
  });

  renderer.render(scene,camera);
  requestAnimationFrame(animate);
}
animate();

window.addEventListener('resize',()=>{
  renderer.setSize(innerWidth,innerHeight);
});
</script>

</body>
</html>
