<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Theatre Works — Ksenia Fedorova</title>

<style>
  .cloudNode {
  position: fixed;
  width: 26px;
  height: 26px;
  border-radius: 50%;

  background: radial-gradient(
    circle at 30% 30%,
    rgba(255,255,255,0.65),
    rgba(255,255,255,0.15),
    rgba(255,255,255,0)
  );

  filter: blur(2px);
  opacity: 0.85;

  z-index: 5;
  cursor: pointer;

  transition: transform 0.4s ease, opacity 0.4s ease;
}

.cloudNode:hover {
  transform: scale(1.8);
  opacity: 1;
} 
  .cloudNode.hide {
  opacity: 0;
  transform: scale(0.2);
  pointer-events: none;
}
html, body {
  margin: 0;
  padding: 0;
  overflow: auto;
  font-family: Arial, sans-serif;
  color: #f2f2f2;
  background: #000;
}

/* background canvas */
canvas {
  position: fixed;
  top: 0;
  left: 0;
  z-index: 0;

  pointer-events: none;
}

/* deep atmosphere */
.overlay {
  position: fixed;
  inset: 0;
  background: radial-gradient(
    ellipse at center,
    rgba(0,0,0,0.25),
    rgba(0,0,0,0.78)
  );
  z-index: 1;
  pointer-events: none;
}

/* layout */
main {
  position: relative;
  z-index: 2;
  width: 100%;
  text-align: center;
  padding: 120px 40px;
  box-sizing: border-box;
}

/* typography */
h1 {
  font-size: 38px;
  font-weight: normal;
  margin-bottom: 12px;
}

.subtitle {
  font-size: 16px;
  color: #cfcfcf;
  margin-bottom: 30px;
}

.description {
  max-width: 650px;
  margin: 0 auto 50px auto;
  line-height: 1.7;
  font-size: 15px;
  color: #bdbdbd;
}

/* project */
h2 {
  font-size: 18px;
  font-weight: normal;
  margin-bottom: 10px;
  color: #e6e6e6;
}

p {
  font-size: 14px;
  line-height: 1.6;
  color: #cfcfcf;
  max-width: 700px;
  margin: 0 auto;
}

/* 🌊 IMAGE: emerging object */
img {
  width: 100%;
  max-width: 720px;
  margin: 25px auto;
  display: block;

  opacity: 0;
  transform: scale(0.86) translateY(18px);
  filter: contrast(0.9) saturate(0.85) blur(1px);

  transition:
    transform 1.4s ease,
    opacity 1.4s ease,
    filter 1.4s ease;
}

/* when loaded → “emerges” */
img.visible {
  opacity: 1;
  transform: scale(1) translateY(0);
  filter: contrast(1) saturate(0.95) blur(0px);
}

/* audio minimal */
audio {
  width: 100%;
  max-width: 720px;
  margin-top: 10px;
  opacity: 0.75;
}

/* spacing */
.spacer {
  height: 60px;
}
.playBtn {
  padding: 10px 14px;
  border: 1px solid rgba(255,255,255,0.4);
  background: transparent;
  color: #f2f2f2;
  cursor: pointer;
  letter-spacing: 2px;

  opacity: 0;
  pointer-events: none;
  transform: translateY(10px);
  transition: 0.8s ease;
}

.playBtn.show {
  opacity: 1;
  pointer-events: auto;
  transform: translateY(0);
  position: relative;
  z-index: 10;
}
 .project {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 18px;

  max-width: 500px;
  margin: 0 auto;

  transform: translateX(-30px);
}
#theatreImg {
  width: 280px;
  max-width: 40%;
}

  .trackTitle {
  font-size: 12px;
  opacity: 0.7;
  letter-spacing: 1px;
}

.trackList {
  display: flex;
  gap: 6px;
  margin-top: 6px;
}

.track {
  background: transparent;
  border: 1px solid rgba(255,255,255,0.3);
  color: white;
  font-size: 12px;
  padding: 4px 6px;
  cursor: pointer;
  opacity: 0.7;
  transition: 0.3s ease;
}

.track:hover {
  opacity: 1;
  border-color: white;
}
 .right {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  justify-content: center;

  gap: 8px;

  flex: 0 0 auto;

  opacity: 0;
  pointer-events: none;
  transform: translateY(10px);
  transition: 0.8s ease;
}
.right.show {
  opacity: 1;
  pointer-events: auto;
  transform: translateY(0);
}
  #progress {
  width: 140px;
  margin-top: 6px;
  cursor: pointer;

  -webkit-appearance: none;
  appearance: none;

  background: transparent;

  opacity: 0;
  pointer-events: none;
  transition: 0.8s ease;
}

/* сама дорожка */
#progress::-webkit-slider-runnable-track {
  height: 2px;
  border-radius: 2px;

  background: linear-gradient(
    to right,
    rgba(255,255,255,0.9) 0%,
    rgba(255,255,255,0.9) var(--progress, 0%),
    rgba(255,255,255,0.2) var(--progress, 0%),
    rgba(255,255,255,0.2) 100%
  );

  box-shadow: 0 0 6px rgba(255,255,255,0.15);
}

/* бегунок (точка) */
#progress::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;

  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: rgba(255,255,255,0.9);

  margin-top: -4px;
}

/* Firefox (на всякий) */
#progress::-moz-range-track {
  height: 2px;
  background: rgba(255,255,255,0.35);
}

#progress::-moz-range-thumb {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: rgba(255,255,255,0.9);
  border: none;
}

#progress.show {
  opacity: 0.7;
  pointer-events: auto;
}
  .navInline {
  width: 100%;
  display: flex;
  justify-content: center; /* или left если хочешь левее текста */
  margin: 10px 0;
}

.navBack {
  cursor: pointer;
  font-size: 18px;
  color: rgba(255,255,255,0.7);
  transition: 0.3s ease;
}

.navBack:hover {
  color: rgba(255,255,255,1);
  transform: scale(1.2);
}
</style>
</head>

<body>

<div class="overlay"></div>
  <div class="cloudNode" id="theatreNode"></div>

<main>

  <h1>Theatre Works</h1>

  <div class="subtitle">
    Selected compositions for theatre productions
  </div>

  <div class="description">
    Original music for theatre projects, productions and studies.
  </div>
<div class="navInline">
  <span class="navBack">←</span>
</div>
  <div class="spacer"></div>

  <h2>Children’s theatre production (Kazan)</h2>

  <p>
    Original music for a long-running repertory production in a state theatre.
  </p>
<div class="project">

  <img src="theatre1.jpg" id="theatreImg">

  <div class="right">

  <div class="trackTitle">excerpt 01</div>

  <button id="playBtn" class="playBtn">PLAY</button>
    <input type="range" id="progress" value="0" min="0" max="100">

  <div class="trackList">
    <button class="track" data-src="excerpt1.mp3">01</button>
    <button class="track" data-src="excerpt2.mp3">02</button>
    <button class="track" data-src="excerpt3.mp3">03</button>
  </div>

</div>

<audio id="theatreAudio" preload="none">
  <source src="excerpt1.mp3" type="audio/mpeg">
</audio>
</main>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.161/build/three.module.js';

const scene = new THREE.Scene();

const camera = new THREE.OrthographicCamera(-1,1,1,-1,0.1,10);
camera.position.z = 1;

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

/* background texture */
const texture = new THREE.TextureLoader().load('clouds_theatre.jpg');
texture.colorSpace = THREE.SRGBColorSpace;

/* mouse */
const mouse = new THREE.Vector2(0.5, 0.5);
const prevMouse = new THREE.Vector2(0.5, 0.5);
  let isOpened = false;
const node = document.getElementById('theatreNode');
const img = document.getElementById('theatreImg');
const right = document.querySelector('.right');
const btn = document.getElementById('playBtn');
const audio = document.getElementById('theatreAudio');
const navBack = document.querySelector('.navBack');
let isPlaying = false;
  
window.addEventListener('mousemove', (e) => {
  mouse.x = e.clientX / window.innerWidth;
  mouse.y = 1.0 - e.clientY / window.innerHeight;
});

const geometry = new THREE.PlaneGeometry(2,2);

const material = new THREE.ShaderMaterial({

  uniforms: {
    uTexture: { value: texture },
    uMouse: { value: mouse },
    uPrevMouse: { value: prevMouse },
    uTime: { value: 0 }
  },

  vertexShader: `
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);
    }
  `,

  fragmentShader: `
    uniform sampler2D uTexture;
    uniform vec2 uMouse;
    uniform vec2 uPrevMouse;
    uniform float uTime;

    varying vec2 vUv;

    void main() {

      vec2 uv = vUv;

      float d = distance(uv, uMouse);
      float dp = distance(uv, uPrevMouse);

      float wave = sin(d * 55.0 - uTime * 10.0);
      float wave2 = sin(dp * 60.0 - uTime * 8.0);

      float falloff = exp(-d * 12.0);
      float falloff2 = exp(-dp * 10.0);

      float ripple = wave * falloff + wave2 * falloff2;

      float n1 = sin(uTime * 0.2 + uv.y * 10.0);
      float n2 = cos(uTime * 0.18 + uv.x * 10.0);

      uv += vec2(n1,n2)*0.002;
      uv += ripple*0.004;

      vec4 color = texture2D(uTexture, uv);

      vec3 c = color.rgb;
      c *= 0.85;
      c = c / (c + vec3(0.55));

      gl_FragColor = vec4(c,1.0);
    }
  `
});

scene.add(new THREE.Mesh(geometry, material));

function animate(t){
  material.uniforms.uTime.value = t*0.001;
  prevMouse.lerp(mouse,0.08);
  renderer.render(scene,camera);
  requestAnimationFrame(animate);
}
animate();

/* ✨ emergence trigger */

function placeNode() {
  node.style.left = (window.innerWidth * 0.62) + 'px';
  node.style.top = (window.innerHeight * 0.45) + 'px';
}

placeNode();

window.addEventListener('resize', placeNode);

node.addEventListener('click', () => {

  if (isOpened) return;
  isOpened = true;

  node.classList.add('hide');

  img?.classList.add('visible');
  right?.classList.add('show');
  btn?.classList.add('show');
  document.getElementById('progress')?.classList.add('show');

  if (audio) {
    audio.currentTime = 0;
    audio.play();
  }

  if (btn) {
    btn.textContent = "PAUSE";
  }
});
btn.addEventListener('click', (e) => {
  e.stopPropagation();

  if (!audio) return;

  if (audio.paused) {
    audio.play();
    btn.textContent = "PAUSE";
  } else {
    audio.pause();
    progress.value = 0;
    progress.style.setProperty('--progress', '0%');

    btn.textContent = "PLAY";
  }
});
  const progress = document.getElementById('progress');

audio.addEventListener('timeupdate', () => {

  if (!audio.duration) return;

  progress.value =
    (audio.currentTime / audio.duration) * 100;
});

progress.addEventListener('input', () => {

  if (!audio.duration) return;

  audio.currentTime =
    (progress.value / 100) * audio.duration;
  progress.style.setProperty('--progress', progress.value + '%');
});
  
window.addEventListener('resize', () => {
  renderer.setSize(window.innerWidth, window.innerHeight);
});
document.querySelectorAll('.track').forEach(trackBtn => {
  trackBtn.addEventListener('click', () => {
    progress.value = 0;
    progress.style.setProperty('--progress', '0%');

    const src = trackBtn.dataset.src;

    audio.src = src;
    audio.currentTime = 0;
    audio.play();

    isPlaying = true;
    if (btn) btn.textContent = "PAUSE";
  });
});

const navBack = document.querySelector('.navBack');

navBack?.addEventListener('click', () => {
  window.location.href = "index.html";
});
</script>

</body>
</html>
