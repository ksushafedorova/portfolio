<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Theatre Works — Ksenia Fedorova</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  background: #000;
  font-family: Arial, sans-serif;
  color: #f2f2f2;
}

canvas {
  position: fixed;
  inset: 0;
  z-index: 0;
}

.overlay {
  position: fixed;
  inset: 0;
  background: radial-gradient(
    ellipse at center,
    rgba(0,0,0,0.15),
    rgba(0,0,0,0.65)
  );
  z-index: 1;
  pointer-events: none;
}

/* PANEL */
.panel {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(0.95);

  width: 520px;
  background: rgba(0,0,0,0.85);
  border: 1px solid rgba(255,255,255,0.15);

  padding: 16px;
  z-index: 10;

  opacity: 0;
  pointer-events: none;
  transition: 0.5s ease;
}

.panel.open {
  opacity: 1;
  pointer-events: auto;
  transform: translate(-50%, -50%) scale(1);
}

.panel img {
  width: 100%;
  margin-bottom: 10px;
}

/* hint */
.hint {
  position: fixed;
  top: 20px;
  left: 20px;
  z-index: 2;
  color: rgba(255,255,255,0.7);
  font-size: 14px;
}
</style>
</head>

<body>

<div class="overlay"></div>
<div class="hint">click glowing clouds</div>

<div class="panel" id="panel">
  <img src="theatre1.jpg">
  <div>Children’s theatre production (Kazan)</div>
  <audio id="audio" src="theatre1.mp3"></audio>
  <button id="btn">PLAY</button>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.161/build/three.module.js';

const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-1,1,1,-1,0.1,10);
camera.position.z = 1;

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
document.body.appendChild(renderer.domElement);

/* BACKGROUND */
const texture = new THREE.TextureLoader().load('clouds_theatre.jpg');
texture.colorSpace = THREE.SRGBColorSpace;

const material = new THREE.ShaderMaterial({
  uniforms:{
    uTexture:{value:texture},
    uTime:{value:0}
  },
  vertexShader:`
    varying vec2 vUv;
    void main(){
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);
    }
  `,
  fragmentShader:`
    uniform sampler2D uTexture;
    uniform float uTime;
    varying vec2 vUv;

    void main(){
      vec2 uv = vUv;

      uv += sin(uTime*0.08 + uv.y*6.0)*0.002;

      vec4 c = texture2D(uTexture, uv);
      vec3 col = c.rgb * 0.92;
      col = col / (col + vec3(0.55));

      gl_FragColor = vec4(col,1.0);
    }
  `
});

scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), material));

/* CLOUD NODES */
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

const nodes = [];

function addNode(x,y){
  const geo = new THREE.SphereGeometry(0.03,16,16);
  const mat = new THREE.MeshBasicMaterial({
    color: 0xffffff,
    transparent:true,
    opacity:0.9
  });

  const m = new THREE.Mesh(geo,mat);
  m.position.set(x,y,0);
  scene.add(m);
  nodes.push(m);
}

addNode(-0.3,0.2);
addNode(0.2,-0.1);
addNode(0.4,0.25);

/* CLICK FIX (ВАЖНО) */
window.addEventListener('click',(e)=>{
  mouse.x = (e.clientX / innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / innerHeight) * 2 + 1;

  raycaster.setFromCamera(mouse, camera);

  const hits = raycaster.intersectObjects(nodes);

  if(hits.length){
    openPanel();
  }
});

/* PANEL */
const panel = document.getElementById('panel');
const audio = document.getElementById('audio');
const btn = document.getElementById('btn');

function openPanel(){
  panel.classList.add('open');
}

btn.onclick = ()=>{
  if(audio.paused){
    audio.play();
    btn.textContent = "PAUSE";
  } else {
    audio.pause();
    btn.textContent = "PLAY";
  }
};

/* LOOP */
function animate(t){
  material.uniforms.uTime.value = t * 0.001;
  renderer.render(scene,camera);
  requestAnimationFrame(animate);
}
animate();

window.addEventListener('resize',()=>{
  renderer.setSize(innerWidth,innerHeight);
});
</script>

</body>
</html>
