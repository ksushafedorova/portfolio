<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ksenia Fedorova</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: black;
      color: white;
      overflow: hidden;
    }

    /* ОБЛАКА — СРЕДА */
    .bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 120%;
      height: 120%;
      background-image: url("clouds.jpg");
      background-size: cover;
      background-position: center;
      opacity: 0.35;
      animation: drift 30s ease-in-out infinite;
      filter: blur(0.5px);
      z-index: 0;
    }

    @keyframes drift {
      0% { transform: translate(0, 0); }
      50% { transform: translate(-2%, -1.5%); }
      100% { transform: translate(0, 0); }
    }

    /* ОСНОВНОЙ СЛОЙ */
    .overlay {
      position: relative;
      z-index: 2;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    /* ИМЯ */
    .name {
      font-size: 18px;
      letter-spacing: 3px;
      margin-bottom: 10px;
      opacity: 0.9;
    }

    /* ПОДПИСЬ */
    .role {
      font-size: 12px;
      opacity: 0.5;
      margin-bottom: 40px;
    }

    /* СИСТЕМА МЕНЮ */
    .menu {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .menu a {
      color: white;
      text-decoration: none;
      font-size: 16px;
      letter-spacing: 2px;
      opacity: 0.8;
      transition: 0.2s;
    }

    .menu a:hover {
      opacity: 1;
      transform: scale(1.02);
    }

    /* МАЛЕНЬКАЯ ПОЭЗИЯ (stay sound) */
    .hint {
      position: absolute;
      bottom: 30px;
      font-size: 11px;
      opacity: 0.35;
      letter-spacing: 2px;
    }
  </style>
</head>

<body>

<div class="bg"></div>

<div class="overlay">

  <div class="name">KSENIA FEDOROVA</div>
  <div class="role">composer / sound artist</div>

  <div class="menu">
    <a href="theatre.html">CLOUD / THEATRE TRACE</a>
    <a href="film.html">CLOUD / FILM TRACE</a>
    <a href="sound.html">CLOUD / SOUND MATTER</a>
    <a href="trace.html">TRACE ARCHIVE</a>
  </div>

  <div class="hint">stay sound</div>

</div>

</body>
</html>
