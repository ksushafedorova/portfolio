<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ksenia Fedorova</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  background: #000;
  font-family: Arial, sans-serif;
}
canvas { display:block; }
</style>
</head>

<body>

<script type="module">

import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.161/build/three.module.js';

const scene = new THREE.Scene();

const camera = new THREE.OrthographicCamera(-1,1,1,-1,0,1);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

const texture = new THREE.TextureLoader().load('clouds.jpg');
texture.colorSpace = THREE.SRGBColorSpace;

const mouse = new THREE.Vector2(0.5,0.5);

window.addEventListener('mousemove', (e)=>{
  mouse.x = e.clientX / innerWidth;
  mouse.y = 1.0 - e.clientY / innerHeight;
});

const material = new THREE.ShaderMaterial({

  uniforms:{
    uTexture:{ value:texture },
    uMouse:{ value:mouse },
    uTime:{ value:0 }
  },

  vertexShader:`
    varying vec2 vUv;
    void main(){
      vUv = uv;
      gl_Position = vec4(position,1.0);
    }
  `,

  fragmentShader:`
    uniform sampler2D uTexture;
    uniform vec2 uMouse;
    uniform float uTime;

    varying vec2 vUv;

    void main(){

      vec2 uv = vUv;

      float d = distance(uv, uMouse);

      /* --- core ripple --- */
      float ripple = sin(d * 60.0 - uTime * 6.0);

      /* --- soft memory illusion (IMPORTANT PART) --- */
      float memory = exp(-d * 10.0) * 0.15;
      memory *= (0.6 + 0.4 * sin(uTime * 0.5));

      /* combine */
      uv += (ripple * 0.003) + (memory * 0.002);

      vec4 color = texture2D(uTexture, uv);

      /* subtle tone control (NO DARKNESS) */
      color.rgb = pow(color.rgb, vec3(0.98));

      gl_FragColor = color;
    }
  `
});

const mesh = new THREE.Mesh(new THREE.PlaneGeometry(2,2), material);
scene.add(mesh);

function animate(t){
  material.uniforms.uTime.value = t * 0.001;
  renderer.render(scene,camera);
  requestAnimationFrame(animate);
}

animate();

window.addEventListener('resize', ()=>{
  renderer.setSize(innerWidth, innerHeight);
});

</script>

</body>
</html>
