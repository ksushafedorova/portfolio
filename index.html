<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ksenia Fedorova</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  background: #000;
  font-family: Arial, sans-serif;
  color: #f2f2f2;
}

canvas {
  display: block;
}

.overlay {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.22);
  pointer-events: none;
}

main {
  position: absolute;
  z-index: 10;

  width: 100%;
  top: 50%;
  left: 50%;

  transform: translate(-50%, -50%);

  text-align: center;

  pointer-events: none;
}

h1 {
  font-size: 38px;
  font-weight: normal;
  letter-spacing: 1px;
  margin-bottom: 12px;
}

.subtitle {
  font-size: 16px;
  color: #d9d9d9;
  margin-bottom: 34px;
}

.description {
  max-width: 650px;
  margin: 0 auto;
  line-height: 1.7;
  font-size: 15px;
  color: #cfcfcf;
  margin-bottom: 60px;
}

.menu {
  pointer-events: auto;
}

.stay {
  display: inline-block;

  cursor: pointer;

  font-size: 13px;
  letter-spacing: 3px;

  opacity: 0.72;

  transition:
    opacity 0.3s ease,
    transform 0.3s ease;
}

.stay:hover {
  opacity: 1;
  transform: translateY(-2px);
}

.dropdown {
  margin-top: 24px;

  opacity: 0;
  max-height: 0;

  overflow: hidden;

  transition:
    opacity 0.7s ease,
    max-height 0.9s ease;
}

.dropdown.open {
  opacity: 1;
  max-height: 400px;
}

.dropdown a {
  display: block;

  margin: 14px 0;

  color: #f2f2f2;
  text-decoration: none;

  font-size: 15px;
  letter-spacing: 2px;

  opacity: 0.82;

  transition: opacity 0.3s ease;
}

.dropdown a:hover {
  opacity: 1;
}
</style>
</head>

<body>

<div class="overlay"></div>

<main>

  <h1>Ksenia Fedorova</h1>

  <div class="subtitle">
    composer / sound artist / theatre & film music
  </div>

  <div class="description">
    I work with theatre, film, animation and experimental sound.
    My practice combines voice, piano, electronics and field recordings.
  </div>

  <div class="menu">

    <div class="stay" onclick="toggleMenu()">
      STAY SOUND +
    </div>

    <div class="dropdown" id="dropdown">
      <a href="theatre.html">THEATRE TRACE</a>
      <a href="film.html">FILM TRACE</a>
      <a href="sound.html">SOUND TRACE</a>
      <a href="fragments.html">FRAGMENTS</a>
    </div>

  </div>

</main>

<script type="module">

import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.161/build/three.module.js';

const scene = new THREE.Scene();

const camera = new THREE.OrthographicCamera(
  -1, 1, 1, -1, 0.1, 10
);

camera.position.z = 1;

const renderer = new THREE.WebGLRenderer({
  antialias: true
});

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);

document.body.appendChild(renderer.domElement);

/* 🌫️ CLOUD TEXTURE */

const textureLoader = new THREE.TextureLoader();

const texture = textureLoader.load('clouds.jpg');

texture.minFilter = THREE.LinearFilter;

/* 🫧 MOUSE */

const mouse = new THREE.Vector2(0.5, 0.5);

window.addEventListener('mousemove', (e) => {

  mouse.x = e.clientX / window.innerWidth;
  mouse.y = 1.0 - (e.clientY / window.innerHeight);

});

/* 🌊 SHADER */

const material = new THREE.ShaderMaterial({

  uniforms: {

    uTexture: { value: texture },

    uMouse: { value: mouse },

    uTime: { value: 0 }

  },

  vertexShader: `
    varying vec2 vUv;

    void main() {
      vUv = uv;

      gl_Position =
        projectionMatrix *
        modelViewMatrix *
        vec4(position, 1.0);
    }
  `,

  fragmentShader: `

    uniform sampler2D uTexture;
    uniform vec2 uMouse;
    uniform float uTime;

    varying vec2 vUv;

    void main() {

      vec2 uv = vUv;

      /* 🌫️ DISTANCE FROM CURSOR */

      float dist =
        distance(uv, uMouse);

      /* 🌊 SOFT FIELD */

      float wave =
        exp(-dist * 8.0);

      /* 🫧 ORGANIC DISTORTION */

      uv.x +=
        sin(uv.y * 14.0 + uTime * 0.4)
        * wave
        * 0.018;

      uv.y +=
        cos(uv.x * 10.0 + uTime * 0.3)
        * wave
        * 0.012;

      /* 🌫️ VERY SOFT GLOBAL MOVEMENT */

      uv.x += sin(uTime * 0.03) * 0.003;
      uv.y += cos(uTime * 0.025) * 0.003;

      vec4 color =
        texture2D(uTexture, uv);

      gl_FragColor = color;
    }

  `
});

const geometry =
  new THREE.PlaneGeometry(2, 2);

const plane =
  new THREE.Mesh(geometry, material);

scene.add(plane);

/* RENDER LOOP */

function animate(time) {

  material.uniforms.uTime.value =
    time * 0.001;

  renderer.render(scene, camera);

  requestAnimationFrame(animate);
}

animate();

/* RESIZE */

window.addEventListener('resize', () => {

  renderer.setSize(
    window.innerWidth,
    window.innerHeight
  );

});

</script>

<script>
function toggleMenu() {
  document
    .getElementById('dropdown')
    .classList
    .toggle('open');
}
</script>

</body>
</html>
