<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ksenia Fedorova</title>

  <style>
    @keyframes driftBack {
      0%   { transform: translate(0px, 0px); }
      50%  { transform: translate(-18px, 10px); }
      100% { transform: translate(0px, 0px); }
    }

    @keyframes driftFront {
      0%   { transform: translate(0px, 0px); }
      50%  { transform: translate(20px, -10px); }
      100% { transform: translate(0px, 0px); }
    }

    a {
      color: #f2f2f2;
      text-decoration: none;
      letter-spacing: 2px;
      display: block;
      margin: 10px 0;
      font-size: 15px;
      opacity: 0.85;
    }

    a:hover {
      opacity: 1;
    }
  </style>
</head>

<body style="
  margin:0;
  font-family: Arial;
  color:#f2f2f2;
  background:#000;
  overflow-x:hidden;
">

<!-- 🌫 CLOUD LAYERS (ФОН, ЭТО СИСТЕМА, НЕ КНОПКА) -->

<div style="
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:url('clouds.jpg') center/cover no-repeat;
  opacity:0.45;
  filter: contrast(1.5) brightness(1.15);
  animation: driftBack 140s ease-in-out infinite;
  z-index:-2;
"></div>

<div style="
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:url('clouds.jpg') center/cover no-repeat;
  opacity:0.25;
  filter: contrast(1.6) brightness(1.2);
  animation: driftFront 100s ease-in-out infinite;
  z-index:-1;
"></div>

<div style="
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.28);
  z-index:0;
"></div>

<!-- 🌫 INDEX / ВХОД -->

<main style="
  position:relative;
  z-index:1;
  max-width:800px;
  margin:0 auto;
  padding:100px 40px;
  text-align:center;
">

  <!-- ИМЯ (как ты хотела — чисто и в картинке) -->
  <h1 style="
    font-size:36px;
    font-weight:normal;
    margin-bottom:10px;
  ">
    Ksenia Fedorova
  </h1>

  <p style="
    font-size:16px;
    color:#e6e6e6;
    margin-bottom:5px;
  ">
    composer / sound artist
  </p>

  <!-- 🌫 STAY SOUND (как состояние, не кнопка) -->
  <p style="
    font-size:11px;
    letter-spacing:3px;
    color:#aaa;
    opacity:0.6;
    margin-bottom:40px;
  ">
    stay sound
  </p>

  <p style="
    font-size:15px;
    line-height:1.6;
    color:#d0d0d0;
    margin-bottom:60px;
  ">
    I work with theatre, film, animation and experimental sound.
    My practice combines voice, piano, electronics and field recordings.
  </p>

  <hr style="
    border:none;
    border-top:1px solid rgba(255,255,255,0.2);
    margin:40px 0;
  ">

  <!-- 🧩 TRACE = ГЛАВНЫЙ ВХОД В РАБОТЫ -->
  <nav>

    <a href="trace.html">TRACE ARCHIVE</a>

    <!-- вторичный слой -->

</html>
