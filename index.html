<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ksenia Fedorova</title>

  <style>
    @keyframes driftBack {
      0%   { transform: translate(0px, 0px); }
      50%  { transform: translate(-18px, 10px); }
      100% { transform: translate(0px, 0px); }
    }

    @keyframes driftFront {
      0%   { transform: translate(0px, 0px); }
      50%  { transform: translate(20px, -10px); }
      100% { transform: translate(0px, 0px); }
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #f2f2f2;
      background: #0b0b10;
      overflow-x: hidden;
    }

    a {
      color: #f2f2f2;
      text-decoration: none;
    }

    /* CLOUD LAYERS */

    .back-layer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: url('clouds.jpg') center/cover no-repeat;
      opacity: 0.45;
      filter: contrast(1.35) brightness(1.15);
      animation: driftBack 140s ease-in-out infinite;
      z-index: -2;
    }

    .front-layer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: url('clouds.jpg') center/cover no-repeat;
      opacity: 0.25;
      filter: contrast(1.45) brightness(1.2);
      animation: driftFront 100s ease-in-out infinite;
      z-index: -1;
    }

    /* OVERLAY (без цвета, только глубина) */

    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.16);
      z-index: 0;
    }

    /* CONTENT */

    main {
      position: relative;
      z-index: 1;
      max-width: 800px;
      margin: 0 auto;
      padding: 110px 40px;
      text-align: center;
    }

    h1 {
      font-size: 36px;
      font-weight: normal;
      margin-bottom: 10px;
      letter-spacing: 1px;
    }

    .subtitle {
      font-size: 16px;
      color: #e6e6e6;
      margin-bottom: 35px;
    }

    .description {
      font-size: 15px;
      line-height: 1.7;
      color: #d0d0d0;
      margin-bottom: 70px;
    }

    /* STAY SOUND */

    .stay-sound {
      display: inline-block;
      cursor: pointer;
      font-size: 13px;
      letter-spacing: 3px;
      color: #d8d8d8;
      opacity: 0.75;
      transition: opacity 0.3s ease;
      margin-bottom: 20px;
    }

    .stay-sound:hover {
      opacity: 1;
    }

    /* DROPDOWN */

    .dropdown {
      margin-top: 20px;
      opacity: 0;
      max-height: 0;
      overflow: hidden;
      transition: opacity 0.8s ease, max-height 1s ease;
    }

    .dropdown.open {
      opacity: 1;
      max-height: 500px;
    }

    .dropdown a {
      display: block;
      margin: 14px 0;
      font-size: 15px;
      letter-spacing: 2px;
      opacity: 0.82;
      transition: opacity 0.3s ease;
    }

    .dropdown a:hover {
      opacity: 1;
    }
  </style>
</head>

<body>

<div class="back-layer"></div>
<div class="front-layer"></div>
<div class="overlay"></div>

<main>

  <h1>Ksenia Fedorova</h1>

  <div class="subtitle">
    composer / sound artist / theatre & film music
  </div>

  <div class="description">
    I work with theatre, film, animation and experimental sound.
    My practice combines voice, piano, electronics and field recordings.
  </div>

  <div class="stay-sound" onclick="toggleMenu()">
    STAY SOUND +
  </div>

  <div class="dropdown" id="dropdown">

    <a href="theatre.html">THEATRE TRACE</a>
    <a href="film.html">FILM TRACE</a>
    <a href="sound.html">SOUND TRACE</a>
    <a href="fragments.html">FRAGMENTS</a>

  </div>

</main>

<script>
  function toggleMenu() {
    document.getElementById('dropdown').classList.toggle('open');
  }
</script>

</body>
</html>
