<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Stay Sound</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      overflow: hidden;
      background: black;
      color: white;
    }

    /* ОБЛАКА ФОН */
    .bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 120%;
      height: 120%;
      background-image: url("clouds.jpg");
      background-size: cover;
      background-position: center;
      opacity: 0.35;
      animation: drift 25s linear infinite;
      filter: blur(0.5px);
    }

    @keyframes drift {
      0% { transform: translate(0, 0); }
      50% { transform: translate(-3%, -2%); }
      100% { transform: translate(0, 0); }
    }

    /* ВХОД */
    .enter {
      position: fixed;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      cursor: pointer;
      text-align: center;
      z-index: 10;
    }

    .title {
      font-size: 16px;
      letter-spacing: 4px;
      opacity: 0.8;
    }

    .subtitle {
      margin-top: 20px;
      font-size: 12px;
      opacity: 0.4;
    }

    /* МЕНЮ (скрыто сначала) */
    .menu {
      position: fixed;
      width: 100%;
      height: 100%;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      z-index: 20;
      text-align: center;
    }

    .menu a {
      color: white;
      text-decoration: none;
      margin: 10px;
      font-size: 18px;
      letter-spacing: 2px;
      opacity: 0.85;
    }

    .menu a:hover {
      opacity: 1;
    }

    .small {
      font-size: 12px;
      opacity: 0.5;
      margin-bottom: 30px;
    }
  </style>
</head>

<body>

<div class="bg"></div>

<!-- ВХОД -->
<div class="enter" id="enter" onclick="enterSite()">
  <div class="title">STAY SOUND</div>
  <div class="subtitle">click to enter</div>
</div>

<!-- МЕНЮ -->
<div class="menu" id="menu">

  <div class="small">CLOUD LAYERS</div>

  <a href="trace.html">TRACE</a>
  <a href="theatre.html">THEATRE</a>
  <a href="film.html">FILM</a>
  <a href="sound.html">SOUND</a>

</div>

<script>
  function enterSite() {
    document.getElementById("enter").style.display = "none";
    document.getElementById("menu").style.display = "flex";
  }
</script>

</body>
</html>
