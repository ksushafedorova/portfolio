<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ksenia Fedorova</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  background: #000;
  font-family: Arial, sans-serif;
  color: #f2f2f2;
}

canvas { display:block; }

/* ===== INDEX LAYER ===== */
#index {
  position: absolute;
  width: 100%;
  top: 50%;
  transform: translateY(-50%);
  text-align: center;
  z-index: 10;
}

h1 { font-size:38px; font-weight:normal; }
.subtitle { opacity:0.8; margin-top:10px; }
.description { max-width:600px; margin:20px auto; line-height:1.6; }

/* MENU */
.menu { margin-top: 30px; }
.menu a {
  display:block;
  margin:10px;
  color:#fff;
  text-decoration:none;
  letter-spacing:2px;
}

/* ===== THEATRE LAYER ===== */
#theatre {
  position:absolute;
  inset:0;
  display:none;
  z-index:20;
  background: rgba(0,0,0,0.2);
  text-align:center;
}

#theatre.active {
  display:block;
}

.theatre-box {
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
}

.theatre-box img {
  width:300px;
  margin-bottom:20px;
}

/* back */
.back {
  position:absolute;
  top:20px;
  left:20px;
  cursor:pointer;
}
</style>
</head>

<body>

<!-- INDEX -->
<div id="index">
  <h1>Ksenia Fedorova</h1>

  <div class="subtitle">
    composer / sound artist / theatre & film music
  </div>

  <div class="description">
    I work with theatre, film, animation and experimental sound.
    My practice combines voice, piano, electronics and field recordings.
  </div>

  <div class="menu">
    <a href="#" onclick="openTheatre()">THEATRE TRACE</a>
    <a href="#">FILM TRACE</a>
    <a href="#">SOUND TRACE</a>
    <a href="#">SOLO PRACTICE</a>
    <a href="#">FRAGMENTS</a>
  </div>
</div>

<!-- THEATRE -->
<div id="theatre">
  <div class="back" onclick="closeTheatre()">← back</div>

  <div class="theatre-box">
    <img src="theatre.jpg">

    <div style="max-width:500px;margin:0 auto;">
      <p>
        Theatre work description goes here.
      </p>
    </div>

    <audio controls src="theatre_audio.mp3"></audio>
  </div>
</div>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.161/build/three.module.js";

const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-1,1,1,-1,0.1,10);
camera.position.z = 1;

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(window.innerWidth,window.innerHeight);
document.body.appendChild(renderer.domElement);

/* textures */
const texIndex = new THREE.TextureLoader().load("clouds.jpg");
const texTheatre = new THREE.TextureLoader().load("clouds_theatre.jpg");

texIndex.colorSpace = THREE.SRGBColorSpace;
texTheatre.colorSpace = THREE.SRGBColorSpace;

let progress = 0;

/* shader */
const mat = new THREE.ShaderMaterial({
  uniforms:{
    uA:{value:texIndex},
    uB:{value:texTheatre},
    uP:{value:0}
  },
  vertexShader:`
    varying vec2 vUv;
    void main(){
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);
    }
  `,
  fragmentShader:`
    uniform sampler2D uA;
    uniform sampler2D uB;
    uniform float uP;
    varying vec2 vUv;

    void main(){
      vec4 a = texture2D(uA,vUv);
      vec4 b = texture2D(uB,vUv);
      gl_FragColor = mix(a,b,uP);
    }
  `
});

const mesh = new THREE.Mesh(new THREE.PlaneGeometry(2,2),mat);
scene.add(mesh);

function animate(){
  mat.uniforms.uP.value += (progress - mat.uniforms.uP.value)*0.05;
  renderer.render(scene,camera);
  requestAnimationFrame(animate);
}
animate();

/* resize */
window.addEventListener("resize",()=>{
  renderer.setSize(innerWidth,innerHeight);
});

/* state */
window.openTheatre = function(){
  progress = 1;
  document.getElementById("index").style.display="none";
  document.getElementById("theatre").classList.add("active");
};

window.closeTheatre = function(){
  progress = 0;
  document.getElementById("index").style.display="block";
  document.getElementById("theatre").classList.remove("active");
};
</script>

</body>
</html>
