<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ksenia Fedorova</title>

  <style>
    @keyframes driftBack {
      0%   { transform: translate(0px, 0px); }
      50%  { transform: translate(-18px, 10px); }
      100% { transform: translate(0px, 0px); }
    }

    @keyframes driftFront {
      0%   { transform: translate(0px, 0px); }
      50%  { transform: translate(20px, -10px); }
      100% { transform: translate(0px, 0px); }
    }

    /* INTRO */
    .intro {
      position: fixed;
      top:0;
      left:0;
      width:100%;
      height:100%;
      background: rgba(0,0,0,0.65);
      display:flex;
      align-items:center;
      justify-content:center;
      flex-direction:column;
      cursor:pointer;
      z-index:10;
      transition: opacity 1s ease;
    }

    .intro-title {
      font-size:14px;
      letter-spacing:4px;
      color:#f2f2f2;
      opacity:0.9;
    }

    .intro-sub {
      margin-top:10px;
      font-size:11px;
      letter-spacing:2px;
      color:#aaa;
      opacity:0.7;
    }

    .hidden {
      opacity:0;
      pointer-events:none;
    }
  </style>
</head>

<body style="
  margin:0;
  font-family: Arial;
  color:#f2f2f2;
  background:#000;
  overflow-x:hidden;
">

<!-- BACK LAYER -->
<div style="
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:url('clouds.jpg') center/cover no-repeat;
  opacity:0.45;
  filter: contrast(1.5) brightness(1.15);
  animation: driftBack 140s ease-in-out infinite;
  z-index:-2;
"></div>

<!-- FRONT LAYER -->
<div style="
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:url('clouds.jpg') center/cover no-repeat;
  opacity:0.25;
  filter: contrast(1.6) brightness(1.2);
  animation: driftFront 100s ease-in-out infinite;
  z-index:-1;
"></div>

<!-- OVERLAY -->
<div style="
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.28);
  z-index:0;
"></div>

<!-- INTRO SCREEN -->
<div class="intro" id="intro" onclick="enterSite()">
  <div class="intro-title">STAY SOUND</div>
  <div class="intro-sub">click to enter</div>
</div>

<!-- MAIN CONTENT -->
<main id="content" style="
  position:relative;
  z-index:1;
  max-width:800px;
  margin:0 auto;
  padding:100px 40px;
  text-align:center;
  opacity:0;
  transition: opacity 1s ease;
">

  <h1 style="font-size:36px; font-weight:normal; margin-bottom:10px;">
    Ksenia Fedorova
  </h1>

  <p style="font-size:16px; color:#e6e6e6; margin-bottom:10px;">
    composer / sound artist / theatre & film music
  </p>

  <p style="font-size:15px; line-height:1.6; color:#d0d0d0; margin-bottom:60px;">
    I work with theatre, film, animation and experimental sound.
    My practice combines voice, piano, electronics and field recordings.
  </p>

  <hr style="border:none; border-top:1px solid rgba(255,255,255,0.2); margin:40px 0;">

  <p style="font-size:12px; letter-spacing:1px; color:#aaa; margin-bottom:15px;">
    CLOUD LAYERS
  </p>

  <nav style="display:flex; justify-content:center; gap:18px; flex-wrap:wrap;">

    <a href="theatre.html" style="color:#f2f2f2; text-decoration:none;">Theatre</a>
    <a href="film.html" style="color:#f2f2f2; text-decoration:none;">Film</a>
    <a href="sound.html" style="color:#f2f2f2; text-decoration:none;">Sound</a>
    <a href="trace.html" style="color:#ffffff; text-decoration:underline;">Trace</a>

  </nav>

</main>

<script>
  function enterSite() {
    document.getElementById("intro").classList.add("hidden");
    document.getElementById("content").style.opacity = "1";
  }
</script>

</body>
</html>
