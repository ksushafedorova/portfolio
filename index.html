<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ksenia Fedorova</title>

  <style>
    /* 2 слоя движения = глубина */
    @keyframes driftBack {
      0%   { transform: translate(0px, 0px) scale(1.05); }
      50%  { transform: translate(-30px, 20px) scale(1.05); }
      100% { transform: translate(0px, 0px) scale(1.05); }
    }

    @keyframes driftFront {
      0%   { transform: translate(0px, 0px) scale(1.1); }
      50%  { transform: translate(40px, -20px) scale(1.1); }
      100% { transform: translate(0px, 0px) scale(1.1); }
    }
  </style>
</head>

<body style="
  margin:0;
  font-family: Arial;
  color:#f2f2f2;
  background:#000;
  overflow-x:hidden;
">

<!-- BACK CLOUD LAYER -->
<div style="
  position:fixed;
  top:-10%;
  left:-10%;
  width:120%;
  height:120%;
  background:url('clouds.jpg') center/cover no-repeat;
  opacity:0.20;
  animation: driftBack 90s ease-in-out infinite;
  z-index:-2;
"></div>

<!-- FRONT CLOUD LAYER -->
<div style="
  position:fixed;
  top:-10%;
  left:-10%;
  width:120%;
  height:120%;
  background:url('clouds.jpg') center/cover no-repeat;
  opacity:0.12;
  animation: driftFront 70s ease-in-out infinite;
  z-index:-1;
"></div>

<!-- DARK OVERLAY -->
<div style="
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.55);
  z-index:0;
"></div>

<!-- CONTENT -->
<main style="
  position:relative;
  z-index:1;
  max-width:800px;
  margin:0 auto;
  padding:100px 40px;
  text-align:center;
">

  <h1 style="font-size:36px; font-weight:normal; margin-bottom:10px;">
    Ksenia Fedorova
  </h1>

  <p style="font-size:16px; color:#ddd; margin-bottom:30px;">
    composer / sound artist / theatre & film music
  </p>

  <p style="font-size:15px; line-height:1.6; color:#ccc; margin-bottom:60px;">
    I work with theatre, film, animation and experimental sound.
    My practice combines voice, piano, electronics and field recordings.
  </p>

  <hr style="border:none; border-top:1px solid rgba(255,255,255,0.2); margin:40px 0;">

  <p style="font-size:12px; letter-spacing:1px; color:#aaa; margin-bottom:15px;">
    MENU
  </p>

  <nav style="display:flex; justify-content:center; gap:20px; flex-wrap:wrap;">
    <a href="index.html" style="color:#f2f2f2; text-decoration:none;">Home</a>
    <a href="theatre.html" style="color:#f2f2f2; text-decoration:none;">Theatre</a>
    <a href="film.html" style="color:#f2f2f2; text-decoration:none;">Film</a>
    <a href="experimental.html" style="color:#f2f2f2; text-decoration:none;">Experimental</a>
    <a href="contact.html" style="color:#f2f2f2; text-decoration:none;">Contact</a>
  </nav>

</main>

</body>
</html>
