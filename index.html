<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ksenia Fedorova</title>

<style>
html, body {
  margin: 0;
  overflow: hidden;
  background: #000;
  font-family: Arial;
  color: #fff;
}
canvas { display:block; }

.overlay {
  position:absolute;
  inset:0;
  background:rgba(0,0,0,0.25);
  pointer-events:none;
}

main{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  text-align:center;
  z-index:10;
  pointer-events:none;
}
h1{font-size:38px;font-weight:normal;}
.subtitle{opacity:0.8;margin-bottom:30px;}
</style>
</head>

<body>

<div class="overlay"></div>

<main>
  <h1>Ksenia Fedorova</h1>
  <div class="subtitle">composer / sound / film / theatre</div>
</main>

<script type="module">

import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.161/build/three.module.js';

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-1,1,1,-1,0,0.1,10);
camera.position.z = 1;

const tex = new THREE.TextureLoader().load('clouds.jpg');
tex.colorSpace = THREE.SRGBColorSpace;

const mouse = new THREE.Vector2(0.5,0.5);
let velocity = new THREE.Vector2();

window.addEventListener('mousemove',(e)=>{
  const nx = e.clientX/innerWidth;
  const ny = 1.0 - e.clientY/innerHeight;

  velocity.x = nx - mouse.x;
  velocity.y = ny - mouse.y;

  mouse.set(nx,ny);
});

/* ---------- MEMORY BUFFER ---------- */

const rtA = new THREE.WebGLRenderTarget(innerWidth,innerHeight);
const rtB = new THREE.WebGLRenderTarget(innerWidth,innerHeight);

let read = rtA;
let write = rtB;

/* ---------- COMPUTE MATERIAL ---------- */

const computeMat = new THREE.ShaderMaterial({
  uniforms:{
    uPrev:{ value:null },
    uMouse:{ value:mouse },
    uVel:{ value:velocity }
  },

  vertexShader:`
    varying vec2 vUv;
    void main(){
      vUv = uv;
      gl_Position = vec4(position,1.0);
    }
  `,

  fragmentShader:`
    uniform sampler2D uPrev;
    uniform vec2 uMouse;
    uniform vec2 uVel;

    varying vec2 vUv;

    void main(){

      vec2 uv = vUv;

      float prev = texture2D(uPrev, uv).r;

      float d = distance(uv, uMouse);
      float speed = length(uVel);

      float add = exp(-d*20.0) * speed * 0.1;

      float memory = prev * 0.94 + add;

      gl_FragColor = vec4(memory,0.0,0.0,1.0);
    }
  `
});

const quad = new THREE.Mesh(
  new THREE.PlaneGeometry(2,2),
  computeMat
);
scene.add(quad);

/* ---------- DISPLAY MATERIAL ---------- */

const displayMat = new THREE.ShaderMaterial({
  uniforms:{
    uTex:{ value:tex },
    uMem:{ value:null }
  },

  vertexShader:`
    varying vec2 vUv;
    void main(){
      vUv = uv;
      gl_Position = vec4(position,1.0);
    }
  `,

  fragmentShader:`
    uniform sampler2D uTex;
    uniform sampler2D uMem;

    varying vec2 vUv;

    void main(){

      vec2 uv = vUv;

      float m = texture2D(uMem, uv).r;

      uv += m * 0.01;

      vec4 col = texture2D(uTex, uv);

      float exposure = 1.05;
      vec3 c = col.rgb * exposure;
      c = c / (c + vec3(0.42));

      gl_FragColor = vec4(c,1.0);
    }
  `
});

/* second scene for display */
const screenScene = new THREE.Scene();
const screenQuad = new THREE.Mesh(new THREE.PlaneGeometry(2,2), displayMat);
screenScene.add(screenQuad);

/* ---------- LOOP ---------- */

function animate(){

  computeMat.uniforms.uPrev.value = read.texture;

  renderer.setRenderTarget(write);
  renderer.render(scene, camera);

  displayMat.uniforms.uMem.value = write.texture;

  renderer.setRenderTarget(null);
  renderer.render(screenScene, camera);

  let tmp = read;
  read = write;
  write = tmp;

  requestAnimationFrame(animate);
}

animate();

window.addEventListener('resize',()=>{
  renderer.setSize(innerWidth,innerHeight);
});

</script>

</body>
</html>
