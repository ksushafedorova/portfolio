<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ksenia Fedorova</title>

<style>
@keyframes driftBack {
  0%   { transform: translate(0px, 0px); }
  50%  { transform: translate(-18px, 10px); }
  100% { transform: translate(0px, 0px); }
}

@keyframes driftFront {
  0%   { transform: translate(0px, 0px); }
  50%  { transform: translate(20px, -10px); }
  100% { transform: translate(0px, 0px); }
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  color: #f2f2f2;
  background: #000;
  overflow-x: hidden;
}

/* LINKS */

a {
  color: #f2f2f2;
  text-decoration: none;
}

/* 🌫️ CLOUD LAYERS */

.back-layer {
  position: fixed;
  inset: -20px;

  background:
    url('clouds.jpg') center/cover no-repeat;

  opacity: 0.45;

  filter:
    contrast(1.5)
    brightness(1.15);

  animation:
    driftBack 140s ease-in-out infinite;

  z-index: -3;
}

.front-layer {
  position: fixed;
  inset: -20px;

  background:
    url('clouds.jpg') center/cover no-repeat;

  opacity: 0.25;

  filter:
    contrast(1.6)
    brightness(1.2);

  animation:
    driftFront 100s ease-in-out infinite;

  z-index: -2;
}

/* 🌫️ LOCAL PRESENCE FIELD */

.presence {
  position: fixed;

  width: 220px;
  height: 220px;

  border-radius: 50%;

  pointer-events: none;

  z-index: -1;

  opacity: 0;

  transform:
    translate(-50%, -50%);

  backdrop-filter:
    blur(1.5px);

  background:
    radial-gradient(
      circle,
      rgba(255,255,255,0.035) 0%,
      rgba(255,255,255,0.015) 35%,
      rgba(255,255,255,0) 75%
    );

  transition:
    opacity 0.45s ease;
}

/* OVERLAY */

.overlay {
  position: fixed;
  inset: 0;

  background: rgba(0,0,0,0.28);

  z-index: 0;
}

/* CONTENT */

main {
  position: relative;
  z-index: 2;

  max-width: 800px;

  margin: 0 auto;

  padding: 110px 40px;

  text-align: center;
}

h1 {
  font-size: 36px;
  font-weight: normal;
  margin-bottom: 10px;
  letter-spacing: 1px;
}

.subtitle {
  font-size: 16px;
  color: #e6e6e6;
  margin-bottom: 35px;
}

.description {
  font-size: 15px;
  line-height: 1.7;
  color: #d0d0d0;
  margin-bottom: 70px;
}

/* STAY SOUND */

.stay-sound {
  display: inline-block;

  cursor: pointer;

  font-size: 13px;
  letter-spacing: 3px;

  color: #d8d8d8;

  opacity: 0.7;

  transform: translateY(4px);

  transition:
    opacity 0.3s ease,
    transform 0.3s ease;

  margin-bottom: 20px;
}

.stay-sound:hover {
  opacity: 1;
  transform: translateY(0px);
}

.stay-sound.active {
  opacity: 1;
  transform: translateY(-2px);
}

/* DROPDOWN */

.dropdown {
  margin-top: 20px;

  opacity: 0;
  max-height: 0;

  overflow: hidden;

  transition:
    opacity 0.8s ease,
    max-height 1s ease;
}

.dropdown.open {
  opacity: 1;
  max-height: 500px;
}

.dropdown a {
  display: block;

  margin: 14px 0;

  font-size: 15px;
  letter-spacing: 2px;

  opacity: 0.82;

  transition: opacity 0.3s ease;
}

.dropdown a:hover {
  opacity: 1;
}
</style>
</head>

<body>

<div class="back-layer"></div>
<div class="front-layer"></div>

<!-- 🌫️ LOCAL REACTION -->
<div class="presence" id="presence"></div>

<div class="overlay"></div>

<main>

  <h1>Ksenia Fedorova</h1>

  <div class="subtitle">
    composer / sound artist / theatre & film music
  </div>

  <div class="description">
    I work with theatre, film, animation and experimental sound.
    My practice combines voice, piano, electronics and field recordings.
  </div>

  <div
    class="stay-sound"
    id="stay"
    onclick="toggleMenu()"
  >
    STAY SOUND +
  </div>

  <div class="dropdown" id="dropdown">

    <a href="theatre.html">
      THEATRE TRACE
    </a>

    <a href="film.html">
      FILM TRACE
    </a>

    <a href="sound.html">
      SOUND TRACE
    </a>

    <a href="fragments.html">
      FRAGMENTS
    </a>

  </div>

</main>

<script>
function toggleMenu() {
  document
    .getElementById('dropdown')
    .classList
    .toggle('open');

  document
    .getElementById('stay')
    .classList
    .toggle('active');
}

/* 🌫️ LOCAL PRESENCE */

const presence =
  document.getElementById('presence');

let hideTimer;

document.addEventListener('mousemove', (e) => {

  presence.style.left =
    e.clientX + 'px';

  presence.style.top =
    e.clientY + 'px';

  presence.style.opacity = '1';

  clearTimeout(hideTimer);

  hideTimer = setTimeout(() => {
    presence.style.opacity = '0';
  }, 120);
});
</script>

</body>
</html>
