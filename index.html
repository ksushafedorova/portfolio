<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ksenia Fedorova</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  background: #000;
  font-family: Arial, sans-serif;
}
canvas { display:block; }
</style>
</head>

<body>

<script type="module">

import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.161/build/three.module.js';

const scene = new THREE.Scene();

const camera = new THREE.OrthographicCamera(-1,1,1,-1,0,1);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

/* ---------------- TEXTURE ---------------- */
const texture = new THREE.TextureLoader().load('clouds.jpg');
texture.colorSpace = THREE.SRGBColorSpace;

/* ---------------- MOUSE ---------------- */
const mouse = new THREE.Vector2(0.5,0.5);
window.addEventListener('mousemove', e=>{
  mouse.x = e.clientX / innerWidth;
  mouse.y = 1.0 - e.clientY / innerHeight;
});

/* ---------------- RENDER TARGETS (MEMORY) ---------------- */
const rt1 = new THREE.WebGLRenderTarget(innerWidth, innerHeight);
const rt2 = new THREE.WebGLRenderTarget(innerWidth, innerHeight);

/* ---------------- FULLSCREEN QUAD ---------------- */
const geometry = new THREE.PlaneGeometry(2,2);

/* ---------------- FEEDBACK SHADER ---------------- */
const feedbackMaterial = new THREE.ShaderMaterial({
  uniforms:{
    uPrev:{ value:null },
    uMouse:{ value:mouse },
    uTexture:{ value:texture }
  },

  vertexShader:`
    varying vec2 vUv;
    void main(){
      vUv = uv;
      gl_Position = vec4(position,1.0);
    }
  `,

  fragmentShader:`
    uniform sampler2D uPrev;
    uniform sampler2D uTexture;
    uniform vec2 uMouse;

    varying vec2 vUv;

    void main(){

      vec2 uv = vUv;

      vec4 prev = texture2D(uPrev, uv);
      vec4 base = texture2D(uTexture, uv);

      float d = distance(uv, uMouse);

      /* very soft disturbance */
      float ripple = exp(-d * 25.0) * 0.02;

      /* feedback mix (key part) */
      vec3 col = mix(base.rgb, prev.rgb, 0.92);

      col += ripple;

      /* keep stable */
      col = clamp(col, 0.0, 1.0);

      gl_FragColor = vec4(col,1.0);
    }
  `
});

const mesh = new THREE.Mesh(geometry, feedbackMaterial);
scene.add(mesh);

/* ---------------- LOOP ---------------- */
function render(){
  feedbackMaterial.uniforms.uPrev.value = rt1.texture;

  renderer.setRenderTarget(rt2);
  renderer.render(scene, camera);

  renderer.setRenderTarget(null);
  renderer.render(scene, camera);

  [rt1, rt2] = [rt2, rt1];

  requestAnimationFrame(render);
}

render();

window.addEventListener('resize', ()=>{
  renderer.setSize(innerWidth, innerHeight);
});
</script>

</body>
</html>
