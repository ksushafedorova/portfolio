<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ksenia Fedorova</title>

<style>
@keyframes driftBack {
  0%   { transform: translate(0px, 0px); }
  50%  { transform: translate(-18px, 10px); }
  100% { transform: translate(0px, 0px); }
}

@keyframes driftFront {
  0%   { transform: translate(0px, 0px); }
  50%  { transform: translate(20px, -10px); }
  100% { transform: translate(0px, 0px); }
}

/* BASE */
body {
  margin: 0;
  font-family: Arial, sans-serif;
  color: #f2f2f2;
  background: #0b0b10;
  overflow-x: hidden;
  transition: background 0.8s ease, color 0.8s ease;
}

/* DAY MODE */
body.day {
  background: #e9e6df;
  color: #1a1a1a;
}

/* CLOUDS */
.back-layer, .front-layer {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: url('clouds.jpg') center/cover no-repeat;
  z-index: -2;
}

.back-layer {
  opacity: 0.45;
  filter: contrast(1.4) brightness(1.2);
  animation: driftBack 140s ease-in-out infinite;
}

.front-layer {
  opacity: 0.25;
  filter: contrast(1.5) brightness(1.25);
  animation: driftFront 100s ease-in-out infinite;
  z-index: -1;
}

/* OVERLAY */
.overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.18);
  z-index: 0;
  transition: background 0.8s ease;
}

body.day .overlay {
  background: rgba(255,255,255,0.15);
}

/* CONTENT */
main {
  position: relative;
  z-index: 1;
  max-width: 800px;
  margin: 0 auto;
  padding: 110px 40px;
  text-align: center;
}

/* TEXT */
h1 {
  font-size: 36px;
  font-weight: normal;
  margin-bottom: 10px;
}

.subtitle {
  font-size: 16px;
  margin-bottom: 5px;
}

.stay {
  font-size: 11px;
  letter-spacing: 3px;
  opacity: 0.6;
  margin-bottom: 40px;
}

/* MENU */
nav a {
  display: block;
  margin: 12px 0;
  font-size: 15px;
  letter-spacing: 2px;
  text-decoration: none;
  color: inherit;
  opacity: 0.85;
}

nav a:hover {
  opacity: 1;
}

/* DROPDOWN */
.dropdown {
  max-height: 0;
  overflow: hidden;
  opacity: 0;
  transition: 0.8s ease;
}

.dropdown.open {
  max-height: 400px;
  opacity: 1;
}

/* BUTTONS */
.controls {
  position: fixed;
  top: 18px;
  right: 20px;
  z-index: 10;
  display: flex;
  gap: 15px;
  font-size: 12px;
  letter-spacing: 2px;
  opacity: 0.7;
  cursor: pointer;
}
</style>
</head>

<body>

<!-- CLOUDS -->
<div class="back-layer"></div>
<div class="front-layer"></div>
<div class="overlay"></div>

<!-- MODE + MENU CONTROLS -->
<div class="controls">
  <div onclick="toggleMode()" id="modeBtn">NIGHT</div>
</div>

<!-- MAIN -->
<main>

  <h1>Ksenia Fedorova</h1>

  <div class="subtitle">
    composer / sound artist
  </div>

  <div class="stay">
    stay sound
  </div>

  <!-- STAY SOUND DROPDOWN -->
  <div style="cursor:pointer; margin-bottom:20px;" onclick="toggleMenu()">
    STAY SOUND +
  </div>

  <div class="dropdown" id="menu">

    <nav>
      <a href="trace.html">TRACE</a>
      <a href="theatre.html">THEATRE TRACE</a>
      <a href="film.html">FILM TRACE</a>
      <a href="sound.html">SOUND TRACE</a>
      <a href="fragments.html">FRAGMENTS</a>
    </nav>

  </div>

</main>

<script>

let isDay = false;

function toggleMode() {
  isDay = !isDay;
  document.body.classList.toggle("day", isDay);
  document.getElementById("modeBtn").innerText = isDay ? "DAY" : "NIGHT";
}

function toggleMenu() {
  document.getElementById("menu").classList.toggle("open");
}

</script>

</body>
</html>
