<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ksenia Fedorova</title>

<style>
@keyframes driftBack {
  0%   { transform: translate(0px, 0px); }
  25%  { transform: translate(-12px, 6px); }
  50%  { transform: translate(-18px, 10px); }
  75%  { transform: translate(-8px, 4px); }
  100% { transform: translate(0px, 0px); }
}

@keyframes driftFront {
  0%   { transform: translate(0px, 0px); }
  25%  { transform: translate(10px, -5px); }
  50%  { transform: translate(14px, -8px); }
  75%  { transform: translate(8px, -3px); }
  100% { transform: translate(0px, 0px); }
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  color: #d6d7db;
  background: #000;
  overflow-x: hidden;
}

a {
  color: inherit;
  text-decoration: none;
}

/* 🫧 CLOUD FOAM */

.back-layer {
  position: fixed;
  inset: 0;
  background: url('clouds.jpg') center/cover no-repeat;
  opacity: 0.52;
  filter: contrast(1.45) brightness(1.1);
  animation: driftBack 180s ease-in-out infinite;
  z-index: -2;
}

.front-layer {
  position: fixed;
  inset: 0;
  background: url('clouds.jpg') center/cover no-repeat;
  opacity: 0.25;
  filter: contrast(1.6) brightness(1.15);
  animation: driftFront 140s ease-in-out infinite;
  z-index: -1;
}

/* 🌑 CONTROL */

.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.22);
  z-index: 0;
}

/* CONTENT */

main {
  position: relative;
  z-index: 1;
  max-width: 800px;
  margin: 0 auto;
  padding: 110px 40px;
  text-align: center;
}

h1 {
  font-size: 36px;
  font-weight: normal;
  margin-bottom: 10px;
  letter-spacing: 1px;
}

.subtitle {
  font-size: 16px;
  margin-bottom: 35px;
  opacity: 0.9;
}

.description {
  font-size: 15px;
  line-height: 1.7;
  margin-bottom: 70px;
  opacity: 0.85;
}

/* 🫧 STAY SOUND */

.stay-sound {
  display: inline-block;
  cursor: pointer;
  font-size: 13px;
  letter-spacing: 3px;
  opacity: 0.6;
  transition: opacity 0.4s ease;
  margin-bottom: 20px;
}

.stay-sound:hover {
  opacity: 1;
}

/* лёгкое “всплытие” при открытии */
.stay-sound.active {
  opacity: 1;
}

/* DROPDOWN */

.dropdown {
  margin-top: 20px;
  opacity: 0;
  max-height: 0;
  overflow: hidden;
  transition: 0.8s ease;
}

.dropdown.open {
  opacity: 1;
  max-height: 500px;
}

.dropdown a {
  display: block;
  margin: 14px 0;
  font-size: 15px;
  letter-spacing: 2px;
  opacity: 0.85;
}

.dropdown a:hover {
  opacity: 1;
}
</style>
</head>

<body>

<div class="back-layer"></div>
<div class="front-layer"></div>
<div class="overlay"></div>

<main>

  <h1>Ksenia Fedorova</h1>

  <div class="subtitle">
    composer / sound artist / theatre & film music
  </div>

  <div class="description">
    I work with theatre, film, animation and experimental sound.
    My practice combines voice, piano, electronics and field recordings.
  </div>

  <div class="stay-sound" id="stay" onclick="toggleMenu()">
    STAY SOUND +
  </div>

  <div class="dropdown" id="dropdown">
    <a href="theatre.html">THEATRE TRACE</a>
    <a href="film.html">FILM TRACE</a>
    <a href="sound.html">SOUND TRACE</a>
    <a href="fragments.html">FRAGMENTS</a>
  </div>

</main>

<script>
function toggleMenu() {
  document.getElementById('dropdown').classList.toggle('open');
  document.getElementById('stay').classList.toggle('active');
}
</script>

</body>
</html>
