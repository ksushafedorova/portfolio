<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ksenia Fedorova</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  background: #000;
  font-family: Arial, sans-serif;
  color: #f2f2f2;
}

canvas { display: block; }

main {
  position: absolute;
  z-index: 10;
  width: 100%;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
  pointer-events: none;
}

h1 { font-size: 38px; font-weight: normal; margin-bottom: 12px; }
.subtitle { font-size: 16px; color: #d9d9d9; margin-bottom: 34px; }
.description {
  max-width: 650px;
  margin: 0 auto;
  line-height: 1.7;
  font-size: 15px;
  color: #cfcfcf;
  margin-bottom: 60px;
}
</style>
</head>

<body>

<main>
  <h1>Ksenia Fedorova</h1>
  <div class="subtitle">composer / sound artist</div>
  <div class="description">interactive surface test</div>
</main>

<script type="module">

import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.161/build/three.module.js';

const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-1,1,1,-1,0.1,10);
camera.position.z = 1;

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const texture = new THREE.TextureLoader().load('clouds.jpg');
texture.colorSpace = THREE.SRGBColorSpace;

/* ---------------- TRAIL SYSTEM ---------------- */

const TRAIL_SIZE = 12;
const trail = [];

for (let i = 0; i < TRAIL_SIZE; i++) {
  trail.push(new THREE.Vector2(0.5, 0.5));
}

window.addEventListener('mousemove', (e) => {
  const x = e.clientX / window.innerWidth;
  const y = 1.0 - e.clientY / window.innerHeight;

  trail.unshift(new THREE.Vector2(x, y));
  trail.pop();
});

/* flatten trail for shader */
function getTrailArray() {
  const arr = [];
  for (let i = 0; i < TRAIL_SIZE; i++) {
    arr.push(trail[i].x, trail[i].y);
  }
  return new Float32Array(arr);
}

/* ---------------- SHADER ---------------- */

const material = new THREE.ShaderMaterial({

  uniforms: {
    uTexture: { value: texture },
    uTime: { value: 0 },
    uTrail: { value: getTrailArray() }
  },

  vertexShader: `
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);
    }
  `,

  fragmentShader: `
    uniform sampler2D uTexture;
    uniform float uTime;
    uniform float uTrail[24];

    varying vec2 vUv;

    void main() {

      vec2 uv = vUv;

      float ripple = 0.0;

      /* --- TRAIL INFLUENCE --- */
      for (int i = 0; i < 12; i++) {

        vec2 p = vec2(uTrail[i*2], uTrail[i*2+1]);

        float d = distance(uv, p);

        float strength = exp(-d * 18.0) * (1.0 - float(i) * 0.08);

        ripple += sin(d * 50.0 - uTime * 8.0) * strength;
      }

      uv += ripple * 0.003;

      vec4 color = texture2D(uTexture, uv);

      float exposure = 1.08;
      vec3 c = color.rgb * exposure;
      c = c / (c + vec3(0.42));

      gl_FragColor = vec4(c,1.0);
    }
  `
});

const mesh = new THREE.Mesh(new THREE.PlaneGeometry(2,2), material);
scene.add(mesh);

/* ---------------- LOOP ---------------- */

function animate(t){
  material.uniforms.uTime.value = t * 0.001;
  material.uniforms.uTrail.value = getTrailArray();

  renderer.render(scene,camera);
  requestAnimationFrame(animate);
}

animate();

window.addEventListener('resize',()=>{
  renderer.setSize(window.innerWidth, window.innerHeight);
});

</script>

</body>
</html>
