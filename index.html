<script type="module">

import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.161/build/three.module.js';

const scene = new THREE.Scene();

const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 10);
camera.position.z = 1;

const renderer = new THREE.WebGLRenderer({ antialias: true });
document.body.appendChild(renderer.domElement);

/* resize (простая и стабильная версия) */
function resize() {
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight, false);
}
resize();
window.addEventListener('resize', resize);

/* texture */
const texture = new THREE.TextureLoader().load('clouds.jpg');
texture.colorSpace = THREE.SRGBColorSpace;

/* mouse */
const mouse = new THREE.Vector2(0.5, 0.5);
const prevMouse = new THREE.Vector2(0.5, 0.5);

window.addEventListener('mousemove', (e) => {
  mouse.x = e.clientX / window.innerWidth;
  mouse.y = 1.0 - e.clientY / window.innerHeight;
});

window.addEventListener('touchmove', (e) => {
  const t = e.touches[0];
  if (!t) return;
  mouse.x = t.clientX / window.innerWidth;
  mouse.y = 1.0 - t.clientY / window.innerHeight;
});

const geometry = new THREE.PlaneGeometry(2, 2);

const material = new THREE.ShaderMaterial({

  uniforms: {
    uTexture: { value: texture },
    uMouse: { value: mouse },
    uPrevMouse: { value: prevMouse },
    uTime: { value: 0 }
  },

  vertexShader: `
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,

  fragmentShader: `
    uniform sampler2D uTexture;
    uniform vec2 uMouse;
    uniform vec2 uPrevMouse;
    uniform float uTime;

    varying vec2 vUv;

    void main() {

      vec2 uv = vUv;

      // ✅ FIX: cover-like aspect correction
      float aspect = float(${window.innerWidth}.0) / float(${window.innerHeight}.0);

      vec2 centered = uv - 0.5;

      if (aspect > 1.0) {
        centered.x *= aspect;
      } else {
        centered.y /= aspect;
      }

      uv = centered + 0.5;

      float d = distance(uv, uMouse);
      float dp = distance(uv, uPrevMouse);

      float wave = sin(d * 55.0 - uTime * 10.0);
      float wave2 = sin(dp * 60.0 - uTime * 8.0);

      float falloff = exp(-d * 12.0);
      float falloff2 = exp(-dp * 10.0);

      float ripple = wave * falloff + wave2 * falloff2;

      float n1 = sin(uTime * 0.2 + uv.y * 10.0);
      float n2 = cos(uTime * 0.18 + uv.x * 10.0);

      uv += vec2(n1, n2) * 0.002;
      uv += ripple * 0.004;

      vec4 color = texture2D(uTexture, uv);

      float exposure = 1.10;
      vec3 c = color.rgb * exposure;
      c = c / (c + vec3(0.42));

      gl_FragColor = vec4(c, 1.0);
    }
  `
});

const plane = new THREE.Mesh(geometry, material);
scene.add(plane);

function animate(time) {
  material.uniforms.uTime.value = time * 0.001;
  prevMouse.lerp(mouse, 0.08);
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}

animate();

</script>
