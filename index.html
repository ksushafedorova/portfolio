<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ksenia Fedorova</title>

<style>
@keyframes driftBack {
  0%   { transform: translate(0px, 0px); }
  50%  { transform: translate(-16px, 8px); }
  100% { transform: translate(0px, 0px); }
}

@keyframes driftFront {
  0%   { transform: translate(0px, 0px); }
  50%  { transform: translate(14px, -6px); }
  100% { transform: translate(0px, 0px); }
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  color: #f2f2f2;
  background: #0b0b10;
  overflow-x: hidden;
}

/* 🫧 FOAM = ЧИСТАЯ СТРУКТУРА */

.back-layer {
  position: fixed;
  inset: 0;
  background: url('clouds.jpg') center/cover no-repeat;
  opacity: 0.55;
  filter: contrast(1.4) brightness(1.1);
  animation: driftBack 160s ease-in-out infinite;
  z-index: -2;
}

.front-layer {
  position: fixed;
  inset: 0;
  background: url('clouds.jpg') center/cover no-repeat;
  opacity: 0.28;
  filter: contrast(1.5) brightness(1.15);
  animation: driftFront 120s ease-in-out infinite;
  z-index: -1;
}

/* 🌑 ОДИН ОВЕРЛЕЙ (контроль читаемости) */

.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.20);
  z-index: 0;
}

/* CONTENT */

main {
  position: relative;
  z-index: 1;
  max-width: 800px;
  margin: 0 auto;
  padding: 110px 40px;
  text-align: center;
}

h1 {
  font-size: 36px;
  font-weight: normal;
  margin-bottom: 10px;
}

.subtitle {
  font-size: 16px;
  margin-bottom: 35px;
  color: #e6e6e6;
}

.description {
  font-size: 15px;
  line-height: 1.7;
  color: #d0d0d0;
  margin-bottom: 70px;
}

/* STAY SOUND */

.stay-sound {
  display: inline-block;
  cursor: pointer;
  font-size: 13px;
  letter-spacing: 3px;
  opacity: 0.8;
  margin-bottom: 20px;
}

/* DROPDOWN */

.dropdown {
  margin-top: 20px;
  opacity: 0;
  max-height: 0;
  overflow: hidden;
  transition: 0.8s ease;
}

.dropdown.open {
  opacity: 1;
  max-height: 500px;
}

.dropdown a {
  display: block;
  margin: 14px 0;
  font-size: 15px;
  letter-spacing: 2px;
  opacity: 0.85;
}

.dropdown a:hover {
  opacity: 1;
}
</style>
</head>

<body>

<div class="back-layer"></div>
<div class="front-layer"></div>
<div class="overlay"></div>

<main>

  <h1>Ksenia Fedorova</h1>

  <div class="subtitle">
    composer / sound artist / theatre & film music
  </div>

  <div class="description">
    I work with theatre, film, animation and experimental sound.
    My practice combines voice, piano, electronics and field recordings.
  </div>

  <div class="stay-sound" onclick="toggleMenu()">
    STAY SOUND +
  </div>

  <div class="dropdown" id="dropdown">
    <a href="theatre.html">THEATRE TRACE</a>
    <a href="film.html">FILM TRACE</a>
    <a href="sound.html">SOUND TRACE</a>
    <a href="fragments.html">FRAGMENTS</a>
  </div>

</main>

<script>
function toggleMenu() {
  document.getElementById('dropdown').classList.toggle('open');
}
</script>

</body>
</html>
