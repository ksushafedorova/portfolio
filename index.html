<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ksenia Fedorova</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  background: #000;
  font-family: Arial, sans-serif;
  color: #f2f2f2;
}

canvas {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
  pointer-events: none;
}
main {
  position: relative;
  z-index: 10;
  width: 100%;
  text-align: center;
  padding: 120px 40px;
  box-sizing: border-box;
}
h1 {
  font-size: 38px;
  font-weight: normal;
  margin-bottom: 12px;
}

.subtitle {
  font-size: 16px;
  color: #d9d9d9;
  margin-bottom: 34px;
}

.description {
  max-width: 650px;
  margin: 0 auto;
  line-height: 1.7;
  font-size: 15px;
  color: #cfcfcf;
  margin-bottom: 60px;
}

.menu {
  pointer-events: auto;
}

.stay {
  display: inline-block;
  cursor: pointer;
  font-size: 13px;
  letter-spacing: 3px;
  opacity: 0.75;
  transition: 0.3s;
}

.stay:hover {
  opacity: 1;
  transform: translateY(-2px);
}

.dropdown {
  margin-top: 24px;
  opacity: 0;
  max-height: 0;
  overflow: hidden;
  transition: 0.7s ease;
}

.dropdown.open {
  opacity: 1;
  max-height: 400px;
}

.dropdown a {
  display: block;
  margin: 14px 0;
  color: #f2f2f2;
  text-decoration: none;
  font-size: 15px;
  letter-spacing: 2px;
  opacity: 0.82;
}

.dropdown a:hover {
  opacity: 1;
}
 @media (max-width: 768px) {

  main {
    position: relative;
    top: auto;
    left: auto;
    transform: none;
    padding: 120px 20px;
  }

   html, body {
  overflow: auto;
}

  h1 {
    font-size: 28px;
  }

  .subtitle {
    font-size: 14px;
  }

  .description {
    font-size: 14px;
    margin-bottom: 40px;
  }
}
</style>
</head>

<body>

<script>
if (window.innerWidth <= 768) {
  window.location.href = "mobile.html";
}
</script>

<div class="overlay">

<main>
  <h1>Ksenia Fedorova</h1>

  <div class="subtitle">
    composer / sound artist / theatre & film music
  </div>

  <div class="description">
    I work with theatre, film, animation and experimental sound.
    My practice combines voice, piano, electronics and field recordings.
  </div>

  <div class="menu">
    <div class="stay" onclick="toggleMenu()">STAY SOUND +</div>

    <div class="dropdown" id="dropdown">
      <a href="theatre.html">THEATRE TRACE</a>
      <a href="film.html">FILM TRACE</a>
      <a href="sound.html">SOUND TRACE</a>
      <a href="solo.html">SOLO PRACTICE</a>
      <a href="fragments.html">FRAGMENTS</a>
    </div>
  </div>
</main>

<script type="module">

import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.161/build/three.module.js';

const scene = new THREE.Scene();

const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 10);
camera.position.z = 1;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

const texture = new THREE.TextureLoader().load('clouds.jpg');
texture.colorSpace = THREE.SRGBColorSpace;

const audio = new Audio('atmosphere.mp3');
audio.loop = true;
audio.volume = 0;

let audioStarted = false;

function startAudio() {
  if (!audioStarted) {
    audio.volume = 0;
    audio.play();

    audioStarted = true;

    let fade = setInterval(() => {
      if (audio.volume < 0.8) {
        audio.volume += 0.02;
      } else {
        clearInterval(fade);
      }
    }, 30);
  }
}

let targetVolume = 0;

window.addEventListener('pointerdown', () => {
  startAudio();
});

window.addEventListener('mousemove', (e) => {

  const speed =
    Math.abs(e.movementX) +
    Math.abs(e.movementY);

  targetVolume = Math.min(speed / 50, 0.8);

});

function updateAudio() {

  audio.volume += (targetVolume - audio.volume) * 0.12;

  targetVolume *= 0.92;

  requestAnimationFrame(updateAudio);
}

updateAudio();
/* mouse + memory */
const mouse = new THREE.Vector2(0.5, 0.5);
const prevMouse = new THREE.Vector2(0.5, 0.5);
let mouseSpeed = 0;
window.addEventListener('mousemove', (e) => {

  const newX = e.clientX / window.innerWidth;
  const newY = 1.0 - e.clientY / window.innerHeight;

  mouseSpeed = Math.hypot(
    newX - mouse.x,
    newY - mouse.y
  );

  mouse.x = newX;
  mouse.y = newY;
});

const geometry = new THREE.PlaneGeometry(2, 2);

const material = new THREE.ShaderMaterial({

  uniforms: {
  uTexture: { value: texture },
  uMouse: { value: mouse },
  uPrevMouse: { value: prevMouse },
  uTime: { value: 0 },

},

  vertexShader: `
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,

  fragmentShader: `
    uniform sampler2D uTexture;
    uniform vec2 uMouse;
    uniform vec2 uPrevMouse;
    uniform float uTime;

    varying vec2 vUv;

    void main() {

      vec2 uv = vUv;



      float d = distance(uv, uMouse);
      float dp = distance(uv, uPrevMouse);

      float wave = sin(d * 55.0 - uTime * 10.0);
      float wave2 = sin(dp * 60.0 - uTime * 8.0);

      float falloff = exp(-d * 12.0);
      float falloff2 = exp(-dp * 10.0);

      float ripple = wave * falloff + wave2 * falloff2;

      float n1 = sin(uTime * 0.2 + uv.y * 10.0);
      float n2 = cos(uTime * 0.18 + uv.x * 10.0);

      uv += vec2(n1, n2) * 0.002;
      uv += ripple * 0.004;

      vec4 color = texture2D(uTexture, uv);

      float exposure = 1.10;
      vec3 c = color.rgb * exposure;
      c = c / (c + vec3(0.42));

      color.rgb = c;

      gl_FragColor = color;
    }
  `
});

const plane = new THREE.Mesh(geometry, material);
scene.add(plane);

function animate(time) {
  material.uniforms.uTime.value = time * 0.001;
  prevMouse.lerp(mouse, 0.08);
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}

animate();

/* FIX: responsive resize for proper aspect */
function onResize() {
  const w = window.innerWidth;
  const h = window.innerHeight;

  renderer.setSize(w, h);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

}

window.addEventListener('resize', onResize);
onResize();

</script>

<script>
function toggleMenu() {
  document.getElementById('dropdown').classList.toggle('open');
}
</script>

</body>
</html>
